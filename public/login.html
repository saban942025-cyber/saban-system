<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SabanOS Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .login-card { background: rgba(30,41,59,0.8); padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        .input-field { background: #1e293b; border: 1px solid #475569; color: white; width: 100%; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        .login-btn { background: #2563eb; width: 100%; padding: 12px; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="text-3xl font-black text-white mb-6">Saban<span class="text-blue-500">OS</span></h1>
        <form onsubmit="event.preventDefault(); handleLogin();">
            <input type="email" id="email" class="input-field" placeholder="אימייל" required>
            <input type="password" id="password" class="input-field" placeholder="סיסמה" required>
            <button type="submit" class="login-btn">התחבר</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" });
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- תיקון חירום: הסרת SW ישנים ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) { registration.unregister(); }
            });
        }

        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                const docSnap = await getDoc(doc(db, "users", email));
                
                if (docSnap.exists()) {
                    localStorage.setItem('saban_user_email', email);
                    window.location.href = "index.html";
                } else {
                    Swal.fire('שגיאה', 'משתמש לא קיים במסד הנתונים', 'error');
                }
            } catch (error) {
                console.error(error);
                Swal.fire('שגיאה', 'פרטים שגויים: ' + error.code, 'error');
            }
        };
    </script>
</body>
</html>
