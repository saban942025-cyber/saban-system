<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SabanOS Core</title>
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        const isHealthy = await new Promise(r => { try { let q=indexedDB.open("t");q.onsuccess=()=>{q.result.close();r(true)};q.onerror=()=>r(false);}catch{r(false)}});
        if(isHealthy) await OneSignal.init({ appId: "07b81f2e-e812-424f-beca-36584b12ccf2" });
      });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { margin: 0; padding: 0; background: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        .app-header { height: 60px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e2e8f0; z-index: 50; }
        
        .main-stage { flex: 1; width: 100%; height: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        .bottom-nav { height: 65px; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 50; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; width: 60px; height: 100%; transition: 0.2s; }
        .nav-btn.active { color: #2563eb; border-top: 2px solid #2563eb; }
        .nav-btn:active { transform: scale(0.9); }

        /* Login Button Style */
        .auth-btn { font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 20px; transition: 0.2s; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .btn-in { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; } /* מחובר */
        .btn-out { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; } /* מנותק */

        /* Blockers & Modals (אותו עיצוב כמו קודם) */
        .blocker-overlay { position: fixed; inset: 0; background: rgba(220, 38, 38, 0.96); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; display: none; padding: 20px; text-align: center; color: white; backdrop-filter: blur(5px); }
        .blocker-card { background: white; color: #1e293b; padding: 30px; border-radius: 24px; width: 100%; max-width: 360px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); animation: popIn 0.4s; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .pulse-ring { display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; background: #fee2e2; border-radius: 50%; margin: 0 auto 20px auto; animation: pulseRed 1.5s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body>

    <audio id="siren-sound" loop src="https://cdn.freesound.org/previews/337/337000_5769786-lq.mp3"></audio>

    <div class="app-header">
        <div onclick="goHome()" class="flex items-center gap-2 cursor-pointer">
            <img id="user-avatar" src="https://ui-avatars.com/api/?name=Guest&background=e2e8f0&color=64748b" class="w-8 h-8 rounded-lg border border-slate-200">
            <div class="flex flex-col">
                <span class="font-black text-sm text-slate-800 leading-tight">Saban<span class="text-blue-600">OS</span></span>
                <span id="user-name-display" class="text-[10px] font-bold text-slate-400">אורח (צפייה בלבד)</span>
            </div>
        </div>
        
        <div id="auth-btn" class="auth-btn btn-out" onclick="handleAuth()">
            <i class="fas fa-sign-in-alt"></i> כניסה
        </div>
    </div>

    <div id="nag-bar" class="hidden bg-yellow-400 text-yellow-900 p-3 px-4 flex justify-between items-center shadow-md z-40 relative">
        <div class="flex items-center gap-3">
            <div class="bg-white/30 p-1.5 rounded-full"><i class="fas fa-bell animate-swing"></i></div>
            <span class="text-xs font-black" id="nag-text">...</span>
        </div>
        <button onclick="openApp('harel', 'משימות')" class="bg-white text-yellow-900 px-3 py-1 rounded-full text-xs font-bold shadow-sm">פתח</button>
    </div>

    <div class="main-stage">
        <iframe id="main-frame" src="dashboard.html"></iframe>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn active" onclick="goHome()" id="nav-home"><i class="fas fa-home text-xl mb-1"></i><span class="text-[10px] font-bold">בית</span></div>
        <div class="nav-btn" onclick="openApp('chat', 'צ\'אט')" id="nav-chat"><i class="fab fa-whatsapp text-xl mb-1"></i><span class="text-[10px] font-bold">צ'אט</span></div>
        <div class="nav-btn" onclick="openApp('drive', 'הארכיון')" id="nav-drive"><i class="fas fa-folder-open text-xl mb-1"></i><span class="text-[10px] font-bold">דרייב</span></div>
        <div class="nav-btn" onclick="openApp('harel', 'משימות')" id="nav-harel"><i class="fas fa-tasks text-xl mb-1"></i><span class="text-[10px] font-bold">משימות</span></div>
    </div>

    <div id="blocker" class="blocker-overlay">
        <div class="blocker-card text-center">
            <div class="pulse-ring"><i class="fas fa-exclamation-triangle text-3xl text-red-600"></i></div>
            <h2 class="text-2xl font-black mb-1">התראה מהמנכ"ל</h2>
            <p class="text-slate-500 text-xs mb-4">נדרשת התייחסות מיידית</p>
            <div class="bg-red-50 border border-red-100 p-4 rounded-xl mb-4">
                <div class="text-lg font-black text-red-900 leading-tight" id="blocker-msg">...</div>
            </div>
            <div id="doc-action-area" class="hidden mb-6">
                <button onclick="openAttachedDoc()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg">
                    <i class="fas fa-file-pdf text-lg"></i> צפה במסמך המצורף
                </button>
            </div>
            <button onclick="confirmTask()" class="w-full border-2 border-red-600 text-red-600 py-3 rounded-xl font-bold text-lg hover:bg-red-50 transition active:scale-95">
                <i class="fas fa-check double"></i> מאשר קבלה
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, arrayUnion, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" }));

        // --- ניהול משתמשים (לצורך בדיקה מהירה ללא DB) ---
        const usersMock = {
            'harel': { name: 'הראל סבן', role: 'מנכ"ל', color: '000000' },
            'vered': { name: 'ורד', role: 'מזכירות', color: 'ec4899' },
            'yossi': { name: 'יוסי', role: 'נהג ראשי', color: 'f97316' },
            'ahmed': { name: 'אחמד', role: 'מנהל עבודה', color: '22c55e' }
        };

        // משתנה שמחזיק את המשתמש הנוכחי
        let currentUser = null; 

        // 1. בדיקה בעליית האפליקציה אם יש משתמש שמור בזיכרון
        function checkAuth() {
            const savedUser = localStorage.getItem('saban_user_id');
            if (savedUser && usersMock[savedUser]) {
                setCurrentUser(savedUser);
            } else {
                updateUI(null);
            }
        }

        // 2. פונקציית כניסה/יציאה
        window.handleAuth = async () => {
            if (currentUser) {
                // יציאה
                Swal.fire({
                    title: 'התנתקות',
                    text: 'האם לצאת מהמערכת?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'כן, צא',
                    cancelButtonText: 'ביטול'
                }).then((res) => {
                    if (res.isConfirmed) {
                        localStorage.removeItem('saban_user_id');
                        window.location.reload(); // רענון כדי לאפס הכל
                    }
                });
            } else {
                // כניסה
                const { value: userId } = await Swal.fire({
                    title: 'הזדהות למערכת',
                    input: 'select',
                    inputOptions: {
                        'harel': 'הראל (מנכ"ל)',
                        'vered': 'ורד (מזכירות)',
                        'yossi': 'יוסי (נהג)',
                        'ahmed': 'אחמד (שטח)'
                    },
                    inputPlaceholder: 'מי אתה?',
                    showCancelButton: true,
                    confirmButtonText: 'כניסה'
                });

                if (userId) {
                    localStorage.setItem('saban_user_id', userId);
                    window.location.reload(); // רענון כדי להחיל הרשאות
                }
            }
        };

        function setCurrentUser(id) {
            currentUser = { id: id, ...usersMock[id] };
            updateUI(currentUser);
            startListening(); // הפעלת האזנה רק אחרי זיהוי
        }

        function updateUI(user) {
            const btn = document.getElementById('auth-btn');
            const avatar = document.getElementById('user-avatar');
            const nameDisplay = document.getElementById('user-name-display');

            if (user) {
                // מצב מחובר
                btn.innerHTML = '<i class="fas fa-sign-out-alt"></i> יציאה';
                btn.className = 'auth-btn btn-out';
                nameDisplay.innerText = user.name + " (" + user.role + ")";
                avatar.src = `https://ui-avatars.com/api/?name=${user.name}&background=${user.color}&color=fff`;
            } else {
                // מצב מנותק
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> כניסה';
                btn.className = 'auth-btn btn-in';
                nameDisplay.innerText = "אורח (לא מחובר)";
                avatar.src = `https://ui-avatars.com/api/?name=Guest&background=e2e8f0&color=64748b`;
            }
        }

        // --- לוגיקת האזנה והתראות ---
        let activeTaskId = null;
        let activeDocLink = null;
        const audio = document.getElementById('siren-sound');

        function startListening() {
            if (!currentUser) return; // לא מאזינים אם לא מחוברים
            
            console.log("👂 מאזין להתראות עבור:", currentUser.name);

            onSnapshot(query(collection(db, "tasks"), where("status", "==", "pending")), (snap) => {
                let foundUrgent = false;

                snap.forEach(d => {
                    const t = d.data();
                    
                    // בדיקה קריטית: האם זה בשבילי?
                    const isForMe = t.assignedTo === 'all' || t.assignedTo === currentUser.id;
                    const notRead = !t.readBy || !t.readBy.includes(currentUser.id);

                    if (isForMe && notRead) {
                        if (t.mustConfirm) {
                            triggerBlocker(d.id, t);
                            foundUrgent = true;
                        } else {
                            document.getElementById('nag-bar').classList.remove('hidden');
                            document.getElementById('nag-text').innerText = t.title;
                        }
                    }
                });

                if (!foundUrgent) {
                    document.getElementById('blocker').style.display = 'none';
                    audio.pause();
                    audio.currentTime = 0;
                }
            });
        }

        function triggerBlocker(id, taskData) {
            if (document.getElementById('blocker').style.display === 'flex') return;
            activeTaskId = id;
            document.getElementById('blocker-msg').innerText = taskData.title;
            
            const docArea = document.getElementById('doc-action-area');
            if (taskData.docLink) {
                activeDocLink = taskData.docLink;
                docArea.classList.remove('hidden');
            } else {
                activeDocLink = null;
                docArea.classList.add('hidden');
            }
            document.getElementById('blocker').style.display = 'flex';
            audio.play().catch(()=>{});
        }

        // פונקציות גלובליות
        window.openAttachedDoc = () => { if(activeDocLink) window.open(activeDocLink, '_blank'); };
        
        window.confirmTask = async () => {
            if(!activeTaskId || !currentUser) return;
            try {
                await updateDoc(doc(db, "tasks", activeTaskId), { readBy: arrayUnion(currentUser.id) });
                document.getElementById('blocker').style.display = 'none';
                audio.pause();
                activeTaskId = null;
            } catch (e) { console.error(e); }
        };

        window.goHome = () => { document.getElementById('main-frame').src = 'dashboard.html'; updateNav('nav-home'); };
        window.openApp = (id, title) => {
            let url = id === 'harel' ? 'harel-tasks.html' : id === 'drive' ? 'documents-drive.html' : id === 'chat' ? 'comm-center.html' : id === 'calendar' ? 'calendar-app.html' : id === 'truck' ? 'driver-app.html' : '';
            if(url) { document.getElementById('main-frame').src = url; updateNav(`nav-${id}`); }
        };
        function updateNav(id) { document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); const btn = document.getElementById(id); if(btn) btn.classList.add('active'); }

        // הפעלה ראשונית
        checkAuth();

    </script>
</body>
</html>
