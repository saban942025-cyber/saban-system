<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SabanOS Worker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { background: #000; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* מסך דריכת מערכת */
        #gate { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .big-btn { width: 150px; height: 150px; background: red; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; border: 5px solid darkred; animation: pulse 1s infinite; cursor: pointer; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* מסך התראה אדום */
        #alert-screen { display: none; position: fixed; inset: 0; background: red; z-index: 100; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .blink-text { font-size: 30px; font-weight: 900; animation: blink 0.5s infinite; color: white; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

        /* בר סטטוס עליון */
        .status-bar { padding: 10px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 5px; }
        .dot.green { background: #0f0; box-shadow: 0 0 10px #0f0; }
        .dot.red { background: #f00; }
    </style>
</head>
<body>

    <div id="gate">
        <div class="text-2xl font-bold mb-6">Saban<span class="text-blue-500">OS</span></div>
        <div class="big-btn" onclick="armSystem()">
            <i class="fas fa-power-off"></i>
        </div>
        <div class="mt-4 text-gray-500 text-sm" id="user-status">טוען משתמש...</div>
    </div>

    <div id="main-app" class="hidden h-full flex flex-col">
        <div class="status-bar">
            <div class="flex items-center">
                <div class="dot green"></div>
                <span class="text-sm font-bold" id="app-user-name">...</span>
            </div>
            <div class="text-xs text-gray-500" id="clock">00:00</div>
        </div>
        <iframe src="dashboard.html" class="flex-1 border-none"></iframe>
    </div>

    <div id="alert-screen">
        <i class="fas fa-radiation fa-spin text-6xl mb-4 text-white"></i>
        <div class="blink-text mb-4">התראה דחופה!</div>
        <div class="text-2xl font-bold bg-black/20 p-4 rounded-xl mb-8 border-2 border-white" id="alert-msg">...</div>
        <button onclick="stopAlert()" class="bg-white text-red-600 font-black px-8 py-4 rounded-full text-xl shadow-2xl">
            מאשר קבלה <i class="fas fa-check"></i>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, onSnapshot, collection, query, where, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" });
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUser = null;
        let activeTaskId = null;

        // מנוע סאונד פשוט וחזק
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let ctx = new AudioCtx();
        let osc = null;

        function playSiren() {
            if(ctx.state === 'suspended') ctx.resume();
            osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(500, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(1000, ctx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            // לולאה ידנית לסירנה
            osc.onended = () => { if(activeTaskId) playSiren(); };
            setTimeout(() => { try{osc.stop()}catch(e){} }, 600);
        }

        // 1. כניסה והזדהות
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            
            const docSnap = await getDoc(doc(db, "users", user.email));
            if (docSnap.exists()) {
                currentUser = { email: user.email, ...docSnap.data() };
                document.getElementById('user-status').innerText = "מחובר: " + currentUser.name;
                document.getElementById('app-user-name').innerText = currentUser.name;
            } else {
                document.getElementById('user-status').innerText = "שגיאה: משתמש לא רשום";
            }
        });

        // 2. דריכת מערכת (ידנית!)
        window.armSystem = () => {
            if(!currentUser) return;
            
            // שחרור חסימת סאונד
            ctx.resume().then(() => {
                const o = ctx.createOscillator();
                o.connect(ctx.destination);
                o.start();
                o.stop(ctx.currentTime + 0.01);
            });

            document.getElementById('gate').style.display = 'none';
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('main-app').classList.add('flex');

            // הפעלת לוגיקה
            startHeartbeat();
            listenForTasks();
        };

        // 3. הדופק (הכי חשוב למלשינון)
        function startHeartbeat() {
            setInterval(() => {
                updateDoc(doc(db, "users", currentUser.email), {
                    lastSeen: serverTimestamp(),
                    status: 'online',
                    device: /Mobile/.test(navigator.userAgent) ? 'Mobile' : 'PC'
                }).catch(e => console.error("Heartbeat error", e));
            }, 10000); // כל 10 שניות!
        }

        // 4. האזנה למשימות (ההתראה)
        function listenForTasks() {
            const q = query(collection(db, "tasks"), where("assignedTo", "==", currentUser.email), where("status", "==", "pending"));
            
            onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const task = change.doc.data();
                        // האם זה באמת חדש? (למנוע התראות כפולות)
                        if (!task.readBy || !task.readBy.includes(currentUser.email)) {
                            triggerAlert(change.doc.id, task.title);
                        }
                    }
                });
            });
        }

        function triggerAlert(id, title) {
            activeTaskId = id;
            document.getElementById('alert-msg').innerText = title;
            document.getElementById('alert-screen').style.display = 'flex';
            
            // הפעלת סירנה בלופ
            const sirenLoop = setInterval(() => {
                if(!activeTaskId) clearInterval(sirenLoop);
                else playSiren();
            }, 1000);
        }

        window.stopAlert = async () => {
            if(!activeTaskId) return;
            const id = activeTaskId;
            activeTaskId = null; // משתיק מיד
            document.getElementById('alert-screen').style.display = 'none';
            
            // עדכון בשרת
            await updateDoc(doc(db, "tasks", id), {
                readBy: arrayUnion(currentUser.email),
                status: 'read' // מסמן שנקרא
            });
        };

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
        }, 1000);

    </script>
</body>
</html>
