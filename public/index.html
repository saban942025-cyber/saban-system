<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SabanOS Core</title>
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        // אתחול רגיל - האישור האמיתי יקרה בלחיצת כפתור למטה
        await OneSignal.init({ appId: "07b81f2e-e812-424f-beca-36584b12ccf2" });
      });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { margin: 0; padding: 0; background: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        /* מסך "התנעת מנועים" - מגן חסימות */
        #permission-gate { position: fixed; inset: 0; background: #0f172a; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white; }
        .start-btn { margin-top: 30px; background: #2563eb; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); animation: pulseBtn 2s infinite; cursor: pointer; transition: 0.3s; }
        .start-btn:hover { transform: scale(1.1); }
        @keyframes pulseBtn { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(37, 99, 235, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); } }

        /* שאר העיצוב הרגיל */
        .app-header { height: 60px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e2e8f0; z-index: 50; }
        .main-stage { flex: 1; width: 100%; height: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .bottom-nav { height: 65px; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 50; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; width: 60px; height: 100%; transition: 0.2s; }
        .nav-btn.active { color: #2563eb; border-top: 2px solid #2563eb; }
        
        /* החוסם האדום */
        .blocker-overlay { position: fixed; inset: 0; background: rgba(220, 38, 38, 0.98); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; display: none; padding: 20px; text-align: center; color: white; backdrop-filter: blur(5px); }
        .blocker-card { background: white; color: #1e293b; padding: 30px; border-radius: 24px; width: 100%; max-width: 360px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); animation: popIn 0.4s; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .pulse-ring { display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; background: #fee2e2; border-radius: 50%; margin: 0 auto 20px auto; animation: pulseRed 1.5s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body>

    <div id="permission-gate">
        <h1 class="text-3xl font-black mb-2">Saban<span class="text-blue-500">OS</span></h1>
        <p class="text-slate-400 text-sm max-w-xs px-6">המערכת דורשת אישור התראות וסאונד כדי לתפקד בזמן אמת</p>
        <div class="start-btn" onclick="startSystem()">
            <i class="fas fa-power-off"></i>
        </div>
        <div class="mt-8 text-xs text-slate-500 font-mono">מזהה משתמש...</div>
    </div>

    <audio id="siren-sound" loop src="https://cdn.freesound.org/previews/337/337000_5769786-lq.mp3"></audio>

    <div class="app-header">
        <div onclick="goHome()" class="flex items-center gap-2 cursor-pointer">
            <img id="user-avatar" src="" class="w-8 h-8 rounded-lg border border-slate-200">
            <div class="flex flex-col">
                <span class="font-black text-sm text-slate-800 leading-tight">Saban<span class="text-blue-600">OS</span></span>
                <span id="user-name-display" class="text-[10px] font-bold text-slate-400">טוען...</span>
            </div>
        </div>
        <button onclick="logout()" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full font-bold border border-slate-200">
            <i class="fas fa-sign-out-alt"></i> יציאה
        </button>
    </div>

    <div id="nag-bar" class="hidden bg-yellow-400 text-yellow-900 p-3 px-4 flex justify-between items-center shadow-md z-40 relative">
        <div class="flex items-center gap-3">
            <div class="bg-white/30 p-1.5 rounded-full"><i class="fas fa-bell animate-swing"></i></div>
            <span class="text-xs font-black" id="nag-text">...</span>
        </div>
        <button onclick="openApp('harel', 'משימות')" class="bg-white text-yellow-900 px-3 py-1 rounded-full text-xs font-bold shadow-sm">פתח</button>
    </div>

    <div class="main-stage">
        <iframe id="main-frame" src=""></iframe>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn active" onclick="goHome()" id="nav-home"><i class="fas fa-home text-xl mb-1"></i><span class="text-[10px] font-bold">בית</span></div>
        <div class="nav-btn" onclick="openApp('chat', 'צ\'אט')" id="nav-chat"><i class="fab fa-whatsapp text-xl mb-1"></i><span class="text-[10px] font-bold">צ'אט</span></div>
        <div class="nav-btn" onclick="openApp('drive', 'הארכיון')" id="nav-drive"><i class="fas fa-folder-open text-xl mb-1"></i><span class="text-[10px] font-bold">דרייב</span></div>
        <div class="nav-btn" onclick="openApp('harel', 'משימות')" id="nav-harel"><i class="fas fa-tasks text-xl mb-1"></i><span class="text-[10px] font-bold">משימות</span></div>
    </div>

    <div id="blocker" class="blocker-overlay">
        <div class="blocker-card text-center">
            <div class="pulse-ring"><i class="fas fa-exclamation-triangle text-3xl text-red-600"></i></div>
            <h2 class="text-2xl font-black mb-1">התראה מהמנכ"ל</h2>
            <div class="bg-red-50 border border-red-100 p-4 rounded-xl mb-4 mt-2">
                <div class="text-lg font-black text-red-900 leading-tight" id="blocker-msg">...</div>
            </div>
            <div id="doc-action-area" class="hidden mb-6">
                <button onclick="openAttachedDoc()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg">
                    <i class="fas fa-file-pdf text-lg"></i> צפה במסמך המצורף
                </button>
            </div>
            <button onclick="confirmTask()" class="w-full border-2 border-red-600 text-red-600 py-3 rounded-xl font-bold text-lg hover:bg-red-50 transition active:scale-95">
                <i class="fas fa-check double"></i> מאשר קבלה
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, arrayUnion, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const app = initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" });
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null; // מכיל את נתוני המשתמש האמיתיים (שם, תפקיד, צבע)
        let activeTaskId = null;
        let activeDocLink = null;
        const audio = document.getElementById('siren-sound');

        // 1. בדיקת התחברות לפני הכל
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // המשתמש מחובר - מושכים את הפרטים שלו מה-DB
                const userDoc = await getDoc(doc(db, "users", user.email));
                if (userDoc.exists()) {
                    currentUserData = { uid: user.email, ...userDoc.data() }; // משתמשים באימייל כ-ID ייחודי
                    
                    // עדכון ממשק משתמש
                    document.getElementById('user-name-display').innerText = `${currentUserData.name} (${currentUserData.role})`;
                    document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${currentUserData.name}&background=${currentUserData.color}&color=fff`;
                    
                    // כעת מחכים שהמשתמש ילחץ על כפתור ההפעלה במסך השחור
                }
            } else {
                // לא מחובר - זרוק אותו ללוגין
                window.location.href = "login.html";
            }
        });

        // 2. פונקציית ההתנעה (נקראת מהכפתור הכחול)
        window.startSystem = () => {
            // ניגון סאונד ריק כדי לשחרר חסימות דפדפן
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(e => console.log("Audio permission pending"));

            // הסתרת מסך הפתיחה
            document.getElementById('permission-gate').style.display = 'none';
            
            // טעינת הדשבורד
            document.getElementById('main-frame').src = 'dashboard.html';

            // התחלת האזנה להתראות (רק עכשיו!)
            startListening();
        };

        // 3. מוח ההתראות - הדבר האמיתי
        function startListening() {
            if (!currentUserData) return;

            console.log("📡 מאזין בשידור חי עבור:", currentUserData.email);

            onSnapshot(query(collection(db, "tasks"), where("status", "==", "pending")), (snap) => {
                let foundUrgent = false;

                snap.forEach(d => {
                    const t = d.data();
                    
                    // זיהוי חכם: האם זה עבורי? (לפי האימייל שלי או 'all')
                    // בדרייב אנחנו נשלח לאימייל, לא לשם
                    const isForMe = t.assignedTo === 'all' || t.assignedTo === currentUserData.email;
                    const notRead = !t.readBy || !t.readBy.includes(currentUserData.email);

                    if (isForMe && notRead) {
                        if (t.mustConfirm) {
                            triggerBlocker(d.id, t);
                            foundUrgent = true;
                        } else {
                            document.getElementById('nag-bar').classList.remove('hidden');
                            document.getElementById('nag-text').innerText = t.title;
                        }
                    }
                });

                if (!foundUrgent) {
                    document.getElementById('blocker').style.display = 'none';
                    audio.pause();
                }
            });
        }

        function triggerBlocker(id, taskData) {
            if (document.getElementById('blocker').style.display === 'flex') return;
            
            activeTaskId = id;
            document.getElementById('blocker-msg').innerText = taskData.title;
            
            const docArea = document.getElementById('doc-action-area');
            if (taskData.docLink) {
                activeDocLink = taskData.docLink;
                docArea.classList.remove('hidden');
            } else {
                activeDocLink = null;
                docArea.classList.add('hidden');
            }
            
            document.getElementById('blocker').style.display = 'flex';
            audio.play().catch(e => console.error("Sound blocked - user interaction needed earlier"));
        }

        // פונקציות עזר
        window.openAttachedDoc = () => { if(activeDocLink) window.open(activeDocLink, '_blank'); };
        
        window.confirmTask = async () => {
            if(!activeTaskId) return;
            try {
                await updateDoc(doc(db, "tasks", activeTaskId), { readBy: arrayUnion(currentUserData.email) });
                document.getElementById('blocker').style.display = 'none';
                audio.pause();
                activeTaskId = null;
            } catch (e) { console.error(e); }
        };

        window.logout = () => {
            signOut(auth).then(() => window.location.href = "login.html");
        };

        window.goHome = () => { document.getElementById('main-frame').src = 'dashboard.html'; updateNav('nav-home'); };
        window.openApp = (id) => {
            let url = id === 'harel' ? 'harel-tasks.html' : id === 'drive' ? 'documents-drive.html' : id === 'chat' ? 'comm-center.html' : '';
            if(url) { document.getElementById('main-frame').src = url; updateNav(`nav-${id}`); }
        };
        function updateNav(id) { document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); const btn = document.getElementById(id); if(btn) btn.classList.add('active'); }
    </script>
</body>
</html>
