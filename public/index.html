<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=S+O&background=2563eb&color=fff&size=32&rounded=true&bold=true">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=S+O&background=2563eb&color=fff&size=192&rounded=true&bold=true">

    <title>SabanOS Core</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        
        // --- ניקוי עובדים ישנים (חשוב לתיקון השגיאה שלך) ---
        if('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for(let reg of regs) {
                // מוחק כל סרביס וורקר שהוא לא שלנו או שהוא sw.js הישן
                if(reg.active && reg.active.scriptURL.includes('sw.js')) {
                    console.log("Unregistering old SW:", reg);
                    await reg.unregister();
                }
            }
        }

        // --- אתחול נקי ---
        try {
            await OneSignal.init({ 
                appId: "07b81f2e-e812-424f-beca-36584b12ccf2",
                allowLocalhostAsSecureOrigin: true, // עוזר בפיתוח
                serviceWorkerParam: { scope: '/' },
                serviceWorkerPath: 'OneSignalSDKWorker.js', // שימוש בקובץ המאוחד
            });
            console.log("OneSignal Initialized Successfully");
        } catch (e) { 
            console.warn("OneSignal Init Failed:", e); 
        }
      });
    </script>

    <style>
        body { margin: 0; padding: 0; background: #0f172a; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        /* Gate */
        #permission-gate { position: fixed; inset: 0; background: #0f172a; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white; }
        .action-btn { margin-top: 30px; width: 240px; padding: 16px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .btn-install { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: 1px solid #3b82f6; animation: pulseBlue 2s infinite; }
        .btn-start { background: #ef4444; color: white; border: 1px solid #b91c1c; display: none; animation: pulseRed 2s infinite; }

        @keyframes pulseBlue { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(37, 99, 235, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); } }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        /* UI */
        .app-header { height: 60px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e2e8f0; }
        .main-stage { flex: 1; width: 100%; height: 100%; position: relative; background: #f8fafc; }
        iframe { width: 100%; height: 100%; border: none; }
        .bottom-nav { height: 65px; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; width: 60px; height: 100%; transition: 0.2s; }
        .nav-btn.active { color: #2563eb; transform: translateY(-2px); }
        .nav-btn i { font-size: 20px; margin-bottom: 2px; }

        /* Alerts */
        .blocker-overlay { position: fixed; inset: 0; background: rgba(220, 38, 38, 0.98); z-index: 99999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: white; text-align: center; }
        .blocker-card { background: white; color: #1e293b; padding: 30px; border-radius: 24px; width: 100%; max-width: 360px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); position: relative; animation: popIn 0.3s; }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .unmute-btn { position: absolute; top: 10px; right: 10px; background: #fee2e2; color: #ef4444; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: bounce 1s infinite; cursor: pointer; }

        #msg-toast { position: fixed; top: -100px; left: 16px; right: 16px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 12px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; z-index: 50; display: flex; align-items: center; gap: 12px; transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
    </style>
</head>
<body>

    <div id="permission-gate">
        <div class="mb-6 text-center">
            <h1 class="text-4xl font-black mb-1">Saban<span class="text-blue-500">OS</span></h1>
            <p class="text-slate-400 text-sm">מערכת הפעלה ארגונית</p>
        </div>

        <button id="install-btn" class="action-btn btn-install" onclick="installPWA()">
            <i class="fas fa-download"></i> התקן לנייד
        </button>

        <button id="start-btn" class="action-btn btn-start" onclick="startSystem()">
            <i class="fas fa-power-off"></i> התחל משמרת
        </button>

        <div id="ios-hint" class="hidden mt-6 bg-slate-800 p-4 rounded-xl text-xs text-left max-w-xs border border-slate-700">
            <div class="font-bold text-blue-400 mb-1">📢 משתמשי אייפון:</div>
            1. לחץ על כפתור השיתוף <i class="fas fa-share-square"></i> למטה.<br>
            2. בחר <b>"הוסף למסך הבית"</b>.
        </div>

        <div id="loading-txt" class="mt-8 text-xs font-mono font-bold animate-pulse text-blue-400">מאתחל מערכת...</div>
    </div>

    <div class="app-header">
        <div onclick="goHome()" class="flex items-center gap-2 cursor-pointer">
            <img id="user-avatar" src="" class="w-8 h-8 rounded-lg border object-cover bg-slate-200">
            <div>
                <span class="font-black text-sm text-slate-800 block leading-none">SabanOS</span>
                <span id="user-name-display" class="text-[10px] text-slate-500">...</span>
            </div>
        </div>
        <button onclick="logout()" class="text-xs bg-slate-100 text-slate-500 px-3 py-1.5 rounded-full border border-slate-200">
            <i class="fas fa-sign-out-alt"></i> יציאה
        </button>
    </div>

    <div class="main-stage">
        <iframe id="main-frame" src=""></iframe>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn active" onclick="openApp('home', this)" id="nav-home"><i class="fas fa-home"></i> בית</div>
        <div class="nav-btn" onclick="openApp('chat', this)" id="nav-chat"><i class="fab fa-whatsapp"></i> צ'אט</div>
        <div class="nav-btn" onclick="openApp('drive', this)" id="nav-drive"><i class="fas fa-folder-open"></i> דרייב</div>
        <div class="nav-btn" onclick="openApp('tasks', this)" id="nav-tasks"><i class="fas fa-tasks"></i> משימות</div>
    </div>

    <div id="msg-toast" onclick="openApp('chat', document.getElementById('nav-chat'))">
        <div class="w-10 h-10 rounded-full bg-green-500 flex items-center justify-center text-white shrink-0"><i class="fab fa-whatsapp text-xl"></i></div>
        <div class="overflow-hidden">
            <div class="font-bold text-sm text-slate-800" id="toast-sender">...</div>
            <div class="text-xs text-slate-500 truncate" id="toast-text">...</div>
        </div>
    </div>

    <div id="blocker" class="blocker-overlay">
        <div class="blocker-card">
            <div class="unmute-btn" onclick="AudioEngine.playSiren()"><i class="fas fa-volume-up"></i></div>
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce text-red-600 text-3xl"><i class="fas fa-bell"></i></div>
            <h2 class="text-2xl font-black mb-2">קריאה דחופה!</h2>
            <div class="bg-red-50 p-4 rounded-xl border border-red-100 mb-4 font-bold text-red-900 text-lg leading-tight" id="blocker-msg">...</div>
            <div id="doc-action-area" class="hidden mb-4">
                <button onclick="openAttachedDoc()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2"><i class="fas fa-file-pdf"></i> פתח מסמך</button>
            </div>
            <button onclick="confirmTask()" class="w-full border-2 border-slate-200 py-3 rounded-xl font-bold text-slate-500 hover:bg-slate-50"><i class="fas fa-check"></i> מאשר קבלה</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, arrayUnion, getDoc, serverTimestamp, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const app = initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" });
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUserData = null;
        let activeTaskId = null;
        let deferredPrompt;

        // OneSignal כבר מטפל בהתקנת ה-SW דרך ה-init למעלה.
        // אנחנו רק צריכים לטפל ב-PWA Install Prompt
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            if (!isStandalone) document.getElementById('install-btn').style.display = 'flex';
            else document.getElementById('start-btn').style.display = 'flex';
        });

        window.addEventListener('load', () => {
            if (isStandalone) {
                document.getElementById('install-btn').style.display = 'none';
                document.getElementById('start-btn').style.display = 'flex';
            } else {
                if(isIOS) {
                    document.getElementById('ios-hint').classList.remove('hidden');
                    document.getElementById('start-btn').style.display = 'flex';
                } else {
                    document.getElementById('install-btn').style.display = 'flex';
                }
            }
        });

        window.installPWA = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('install-btn').style.display = 'none';
                    document.getElementById('start-btn').style.display = 'flex';
                }
                deferredPrompt = null;
            }
        };

        const AudioEngine = {
            ctx: null,
            init: function() { try { const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC(); this.unlock(); } catch(e){} },
            unlock: function() { 
                if(!this.ctx) return;
                const o=this.ctx.createOscillator(); const g=this.ctx.createGain(); g.gain.value=0.001;
                o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+0.1); 
            },
            playSiren: function() {
                if (!this.ctx) this.init(); if (this.ctx.state === 'suspended') this.ctx.resume();
                this.sirenOsc = this.ctx.createOscillator(); this.sirenGain = this.ctx.createGain();
                this.lfo = this.ctx.createOscillator(); const lfoGain = this.ctx.createGain();
                this.sirenOsc.type = 'sawtooth'; this.lfo.type = 'sine'; this.lfo.frequency.value = 2;
                this.lfo.connect(lfoGain); lfoGain.connect(this.sirenOsc.frequency); lfoGain.gain.value = 200;
                this.sirenOsc.frequency.value = 600; this.sirenOsc.connect(this.sirenGain); this.sirenGain.connect(this.ctx.destination);
                this.sirenGain.gain.value = 0.5;
                this.sirenOsc.start(); this.lfo.start();
            },
            stopSiren: function() { if(this.sirenOsc){ try{this.sirenOsc.stop();this.lfo.stop();}catch(e){} this.sirenOsc=null; } },
            playChime: function() {
                if (!this.ctx) this.init(); if (this.ctx.state === 'suspended') this.ctx.resume();
                const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                o.connect(g); g.connect(this.ctx.destination);
                o.type = 'sine'; o.frequency.setValueAtTime(800, this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.3);
                g.gain.setValueAtTime(0.3, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                o.start(); o.stop(this.ctx.currentTime + 0.5);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            const statusTxt = document.getElementById('loading-txt');
            if (user) {
                statusTxt.innerText = "טוען נתונים...";
                try {
                    const userDoc = await getDoc(doc(db, "users", user.email));
                    if (userDoc.exists()) {
                        currentUserData = { uid: user.email, ...userDoc.data() };
                        statusTxt.innerText = `מחובר: ${currentUserData.name}`;
                        statusTxt.className = "mt-8 text-xs font-mono font-bold text-green-500";
                        document.getElementById('user-name-display').innerText = currentUserData.name;
                        document.getElementById('user-avatar').src = currentUserData.photoUrl || `https://ui-avatars.com/api/?name=${currentUserData.name}&background=${currentUserData.color}&color=fff`;
                        if(window.OneSignalDeferred) OneSignalDeferred.push(function(OneSignal) { OneSignal.login(user.email); });
                        startHeartbeat(user.email);
                    } else { statusTxt.innerText = "שגיאה: משתמש לא קיים"; }
                } catch (error) { statusTxt.innerText = "שגיאת רשת"; }
            } else { window.location.href = "login.html"; }
        });

        window.startSystem = async () => {
            AudioEngine.init();
            try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e) {}
            document.getElementById('permission-gate').style.display = 'none';
            document.getElementById('main-frame').src = 'dashboard.html';
            startTaskListener();
            startChatListener();
        };

        function startHeartbeat(email) {
            const beat = () => {
                const device = /Mobile/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop';
                updateDoc(doc(db, "users", email), { lastSeen: serverTimestamp(), status: 'online', device: device }).catch(()=>{});
            };
            beat();
            setInterval(beat, 60000);
        }

        function startTaskListener() {
            if (!currentUserData) return;
            onSnapshot(query(collection(db, "tasks"), where("status", "==", "pending")), (snap) => {
                let foundUrgent = false;
                snap.forEach(d => {
                    const t = d.data();
                    const isForMe = t.assignedTo === 'all' || t.assignedTo === currentUserData.uid;
                    const notRead = !t.readBy || !t.readBy.includes(currentUserData.uid);
                    if (isForMe && notRead && t.mustConfirm) { triggerBlocker(d.id, t); foundUrgent = true; }
                });
                if (!foundUrgent) { document.getElementById('blocker').style.display = 'none'; AudioEngine.stopSiren(); }
            });
        }

        function triggerBlocker(id, taskData) {
            if (document.getElementById('blocker').style.display === 'flex') return;
            activeTaskId = id;
            document.getElementById('blocker-msg').innerText = taskData.title;
            if (taskData.docLink) { window.activeDocLink = taskData.docLink; document.getElementById('doc-action-area').classList.remove('hidden'); } 
            else { document.getElementById('doc-action-area').classList.add('hidden'); }
            document.getElementById('blocker').style.display = 'flex';
            AudioEngine.playSiren();
            updateDoc(doc(db, "users", currentUserData.uid), { lastAction: "קיבל התראה דחופה" });
        }

        function startChatListener() {
            const q = query(collection(db, "chats"), orderBy("createdAt", "desc"), limit(1));
            onSnapshot(q, (snap) => {
                snap.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const msg = change.doc.data();
                        if (msg.email !== currentUserData.uid && (!msg.readBy || !msg.readBy.includes(currentUserData.uid))) {
                            const currentFrame = document.getElementById('main-frame').src;
                            if (!currentFrame.includes('comm-center.html')) showChatToast(msg.senderName, msg.text);
                        }
                    }
                });
            });
        }

        function showChatToast(sender, text) {
            const toast = document.getElementById('msg-toast');
            document.getElementById('toast-sender').innerText = sender;
            document.getElementById('toast-text').innerText = text;
            toast.style.top = "16px"; AudioEngine.playChime();
            setTimeout(() => { toast.style.top = "-100px"; }, 4000);
        }

        window.openAttachedDoc = () => { if(window.activeDocLink) window.open(window.activeDocLink, '_blank'); };
        window.confirmTask = async () => { if(!activeTaskId)return; try{ await updateDoc(doc(db,"tasks",activeTaskId),{readBy:arrayUnion(currentUserData.uid)}); document.getElementById('blocker').style.display='none'; AudioEngine.stopSiren(); activeTaskId=null; } catch(e){} };
        window.logout = () => signOut(auth).then(() => window.location.href="login.html");
        window.goHome = () => { document.getElementById('main-frame').src = 'dashboard.html'; updateNavState(document.getElementById('nav-home')); };
        window.openApp = (page, el) => {
            let url = '';
            if(page === 'home') url = 'dashboard.html'; if(page === 'chat') url = 'comm-center.html';
            if(page === 'drive') url = 'documents-drive.html'; if(page === 'tasks') url = 'harel-tasks.html';
            if(url) { document.getElementById('main-frame').src = url; if(el) updateNavState(el); }
        };
        function updateNavState(el) { document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); }
    </script>
</body>
</html>
