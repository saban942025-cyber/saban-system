<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SabanOS Pro - Vered</title>
    
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { margin: 0; padding: 0; background: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        .app-header { height: 60px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e2e8f0; z-index: 50; }
        .main-stage { flex: 1; width: 100%; height: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* החוסם האדום */
        .blocker-overlay { 
            position: fixed; inset: 0; background: rgba(220, 38, 38, 0.98); 
            z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            display: none; padding: 20px; text-align: center; color: white;
        }
        .siren-icon { font-size: 60px; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="font-black text-xl text-slate-800">SabanOS <span class="text-blue-600 text-xs">Vered</span></div>
        <div id="status-indicator" class="text-xs font-bold text-green-500">מחובר</div>
    </div>

    <div class="main-stage">
        <iframe id="main-frame" src="dashboard.html"></iframe>
    </div>

    <div id="blocker" class="blocker-overlay">
        <div class="siren-icon"><i class="fas fa-radiation-alt"></i></div>
        <h2 class="text-3xl font-black mt-4">הודעה דחופה!</h2>
        <div class="text-xl mt-2 font-bold bg-white text-red-600 px-4 py-2 rounded-lg" id="blocker-msg">...</div>
        <button onclick="confirmTask()" class="mt-8 bg-white text-red-600 px-8 py-4 rounded-full font-black text-xl shadow-xl active:scale-95">
            מאשר קבלה
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, arrayUnion, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        // הגדרות Firebase
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" }));

        // *** הגדרה קשיחה של זהות המשתמש ***
        // וודא שבהראל אתה שולח ל"כולם" או למשתמש שיש לו את ה-ID הזה בדיוק
        const MY_ID = 'vered'; 

        console.log("🔥 מערכת האזנה הופעלה עבור משתמש:", MY_ID);

        // האזנה לכל המשימות הפתוחות
        onSnapshot(query(collection(db, "tasks"), where("status", "==", "pending")), (snap) => {
            console.log("📥 התקבל עדכון מ-DB. מספר משימות פתוחות:", snap.size);
            
            let foundUrgent = false;

            snap.forEach(d => {
                const t = d.data();
                console.log("שודרה משימה:", t.title, "| עבור:", t.assignedTo, "| דחופה:", t.mustConfirm);

                // האם המשימה עבורי? (או לכולם, או ספציפית לורד)
                const isForMe = (t.assignedTo === 'all' || t.assignedTo === MY_ID);
                
                // האם כבר קראתי אותה?
                const alreadyRead = t.readBy && t.readBy.includes(MY_ID);

                if (isForMe && !alreadyRead) {
                    console.log("⚠️ זוהתה משימה רלוונטית שלא נקראה!");
                    
                    if (t.mustConfirm) {
                        console.log("🚨 המשימה דחופה! מפעיל חוסם מסך.");
                        showBlocker(d.id, t.title);
                        foundUrgent = true;
                    }
                }
            });

            if (!foundUrgent) {
                document.getElementById('blocker').style.display = 'none';
            }
        }, (error) => {
            console.error("❌ שגיאה בהתחברות ל-DB:", error);
            document.getElementById('status-indicator').innerText = "שגיאת חיבור";
            document.getElementById('status-indicator').className = "text-xs font-bold text-red-500";
        });

        let activeTaskId = null;

        function showBlocker(id, title) {
            activeTaskId = id;
            document.getElementById('blocker-msg').innerText = title;
            document.getElementById('blocker').style.display = 'flex';
        }

        window.confirmTask = async () => {
            if(!activeTaskId) return;
            console.log("✅ מאשר משימה:", activeTaskId);
            
            try {
                await updateDoc(doc(db, "tasks", activeTaskId), { 
                    readBy: arrayUnion(MY_ID) 
                });
                
                // לוג אופציונלי
                addDoc(collection(db, "task_logs"), {
                    taskId: activeTaskId, userId: MY_ID, userName: 'ורד',
                    action: 'confirm', details: 'אישור ידני', timestamp: serverTimestamp()
                });

                document.getElementById('blocker').style.display = 'none';
            } catch (e) {
                console.error("שגיאה באישור:", e);
                alert("שגיאה בשמירה, נסה שוב");
            }
        };
    </script>
</body>
</html>
