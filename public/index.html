<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SabanOS">
    
    <link rel="icon" type="image/png" href="https://ui-avatars.com/api/?name=S+O&background=2563eb&color=fff&size=32&rounded=true&bold=true">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=S+O&background=2563eb&color=fff&size=192&rounded=true&bold=true">

    <title>SabanOS Core</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      
      // בדיקת בריאות למסד הנתונים לפני שמנסים להפעיל את OneSignal
      async function checkDatabaseHealth() {
          return new Promise((resolve) => {
              try {
                  let req = window.indexedDB.open("test_health");
                  req.onsuccess = () => { req.result.close(); resolve(true); };
                  req.onerror = () => resolve(false);
              } catch (e) {
                  resolve(false);
              }
          });
      }

      OneSignalDeferred.push(async function(OneSignal) {
        const isHealthy = await checkDatabaseHealth();
        
        if (isHealthy) {
            console.log("Database healthy, initializing OneSignal...");
            await OneSignal.init({ 
                appId: "07b81f2e-e812-424f-beca-36584b12ccf2",
                serviceWorkerParam: { scope: '/' },
                serviceWorkerPath: 'OneSignalSDKWorker.js'
            });
        } else {
            console.warn("⚠️ הדפדפן חוסם גישה ל-Database (אולי גלישה בסתר?). ההתראות החיצוניות בוטלו כדי למנוע קריסה.");
        }
      });
<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, arrayUnion, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const app = initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" });
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUserData = null;
        let activeTaskId = null;
        let deferredPrompt;

        // PWA & SW Setup
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        
        // --- מנגנון הלב הפועם (Heartbeat) ---
        // משדר לשרת "אני חי" כל דקה
        function startHeartbeat(email) {
            // עדכון ראשוני
            updateStatus(email, 'online');

            // עדכון מחזורי
            setInterval(() => {
                updateStatus(email, 'online');
            }, 60000); // כל 60 שניות

            // זיהוי יציאה/סגירת טאב
            window.addEventListener('beforeunload', () => {
                updateStatus(email, 'offline');
            });
            
            // זיהוי מעבר לרקע (בטלפון)
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') updateStatus(email, 'online');
                else updateStatus(email, 'away');
            });
        }

        async function updateStatus(email, status) {
            try {
                const deviceType = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop';
                await updateDoc(doc(db, "users", email), {
                    lastSeen: serverTimestamp(), // חותמת זמן של השרת
                    connectionStatus: status,     // online / away / offline
                    device: deviceType            // סוג מכשיר
                });
            } catch(e) { console.error("Heartbeat fail", e); }
        }

        // --- Auth & Init ---
        onAuthStateChanged(auth, async (user) => {
            const statusTxt = document.getElementById('loading-txt');
            if (user) {
                statusTxt.innerText = "טוען נתונים...";
                try {
                    const userDoc = await getDoc(doc(db, "users", user.email));
                    if (userDoc.exists()) {
                        currentUserData = { uid: user.email, ...userDoc.data() };
                        
                        // עדכון ממשק
                        statusTxt.innerText = `מחובר: ${currentUserData.name}`;
                        statusTxt.className = "mt-8 text-xs font-mono font-bold text-green-500";
                        document.getElementById('user-name-display').innerText = currentUserData.name;
                        document.getElementById('user-avatar').src = currentUserData.photoUrl || `https://ui-avatars.com/api/?name=${currentUserData.name}&background=${currentUserData.color}&color=fff`;
                        
                        // חיבור OneSignal
                        if(window.OneSignalDeferred) OneSignalDeferred.push(function(OneSignal) { OneSignal.login(user.email); });

                        // הפעלת הדופק
                        startHeartbeat(user.email);
                        
                        // הפעלת האזנה למשימות
                        startListening();

                    } else { statusTxt.innerText = "שגיאה: משתמש לא קיים"; }
                } catch (error) { console.error(error); }
            } else { window.location.href = "login.html"; }
        });

        // --- Sound Engine (Siren) ---
        const Siren = {
            ctx: null, osc: null, gain: null, lfo: null,
            init: function() { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} },
            play: function() {
                if (!this.ctx) this.init(); if(this.ctx.state==='suspended')this.ctx.resume();
                this.osc = this.ctx.createOscillator(); this.gain = this.ctx.createGain(); this.lfo = this.ctx.createOscillator(); const lg = this.ctx.createGain();
                this.osc.type = 'sawtooth'; this.lfo.type = 'sine'; this.lfo.frequency.value = 2;
                this.lfo.connect(lg); lg.connect(this.osc.frequency); lg.gain.value = 200;
                this.osc.frequency.value = 600; this.osc.connect(this.gain); this.gain.connect(this.ctx.destination);
                this.gain.gain.value = 0.5; this.osc.start(); this.lfo.start();
            },
            stop: function() { if(this.osc){try{this.osc.stop();this.lfo.stop();}catch(e){} this.osc=null;} }
        };

        // --- Logic & UI ---
        window.startSystem = async () => {
            Siren.init();
            try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e) {}
            document.getElementById('permission-gate').style.display = 'none';
            document.getElementById('main-frame').src = 'dashboard.html';
        };

        function startListening() {
            if (!currentUserData) return;
            onSnapshot(query(collection(db, "tasks"), where("status", "==", "pending")), (snap) => {
                let foundUrgent = false;
                snap.forEach(d => {
                    const t = d.data();
                    const isForMe = t.assignedTo === 'all' || t.assignedTo === currentUserData.uid;
                    const notRead = !t.readBy || !t.readBy.includes(currentUserData.uid);
                    if (isForMe && notRead && t.mustConfirm) { triggerBlocker(d.id, t); foundUrgent = true; }
                });
                if (!foundUrgent) { document.getElementById('blocker').style.display = 'none'; Siren.stop(); }
            });
        }

        function triggerBlocker(id, taskData) {
            if (document.getElementById('blocker').style.display === 'flex') return;
            activeTaskId = id;
            document.getElementById('blocker-msg').innerText = taskData.title;
            // עדכון פעילות אחרונה בדאטה בייס לצרכי מעקב מנהל
            updateDoc(doc(db, "users", currentUserData.uid), { lastAction: "קיבל התראה: " + taskData.title });
            
            if (taskData.docLink) { document.getElementById('doc-action-area').classList.remove('hidden'); window.activeDocLink = taskData.docLink; } 
            else { document.getElementById('doc-action-area').classList.add('hidden'); }
            document.getElementById('blocker').style.display = 'flex';
            Siren.play();
        }

        window.openAttachedDoc = () => { if(window.activeDocLink) window.open(window.activeDocLink, '_blank'); };
        window.confirmTask = async () => { 
            if(!activeTaskId)return; 
            try{ 
                await updateDoc(doc(db,"tasks",activeTaskId),{readBy:arrayUnion(currentUserData.uid)}); 
                // עדכון לוג לטובת המנהל
                await updateDoc(doc(db, "users", currentUserData.uid), { lastAction: "אישר התראה: " + document.getElementById('blocker-msg').innerText });
                document.getElementById('blocker').style.display='none'; 
                Siren.stop(); 
                activeTaskId=null; 
            }catch(e){} 
        };
        
        window.logout = () => signOut(auth).then(() => window.location.href="login.html");
        window.goHome = () => { document.getElementById('main-frame').src = 'dashboard.html'; };
        window.openApp = (id) => { 
            let u=id==='harel'?'harel-tasks.html':id==='drive'?'documents-drive.html':id==='chat'?'comm-center.html':id==='calendar'?'calendar-app.html':''; 
            if(u) document.getElementById('main-frame').src=u; 
        };
    </script>
</body>
</html>
