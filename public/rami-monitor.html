<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Rami Monitor (God Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>body{background:#111;color:white;font-family:sans-serif;}</style>
</head>
<body class="p-4">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4 text-blue-500 border-b border-gray-800 pb-2">
            <i class="fas fa-radar"></i> מרכז שליטה ובקרה - זמן אמת
        </h1>

        <div class="grid gap-4" id="users-grid">
            <div class="text-gray-500">טוען נתונים מהלוויין...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" });
        const db = getFirestore(app);

        // האזנה חיה לכל המשתמשים
        onSnapshot(collection(db, "users"), (snapshot) => {
            const grid = document.getElementById('users-grid');
            grid.innerHTML = '';
            
            const now = new Date();

            snapshot.forEach(doc => {
                const u = doc.data();
                
                // חישוב זמן מאז הדופק האחרון
                let isOnline = false;
                let timeDiff = 9999;
                let lastSeenStr = 'מעולם לא';

                if (u.lastSeen) {
                    const lastDate = u.lastSeen.toDate();
                    timeDiff = (now - lastDate) / 1000; // שניות
                    lastSeenStr = lastDate.toLocaleTimeString();
                    if (timeDiff < 60) isOnline = true; // אם שידר בדקה האחרונה -> מחובר
                }

                // עיצוב הכרטיס
                const borderClass = isOnline ? 'border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.3)]' : 'border-gray-700 opacity-60';
                const statusIcon = isOnline ? '<i class="fas fa-wifi text-green-500 animate-pulse"></i> מחובר' : '<i class="fas fa-power-off text-red-500"></i> מנותק';
                const deviceIcon = u.device === 'Mobile' ? '<i class="fas fa-mobile-alt"></i>' : '<i class="fas fa-desktop"></i>';

                grid.innerHTML += `
                    <div class="bg-gray-900 border-2 ${borderClass} rounded-xl p-4 flex justify-between items-center transition-all duration-500">
                        <div class="flex items-center gap-4">
                            <img src="${u.photoUrl || 'https://ui-avatars.com/api/?background=333&color=fff&name='+u.name}" class="w-12 h-12 rounded-full">
                            <div>
                                <div class="font-bold text-lg">${u.name}</div>
                                <div class="text-xs text-gray-400 font-mono">${u.email}</div>
                                <div class="text-xs mt-1 font-bold">${statusIcon} <span class="text-gray-600 mx-2">|</span> נראה לאחרונה: ${lastSeenStr}</div>
                            </div>
                        </div>
                        
                        <div class="text-center">
                            <div class="text-gray-500 text-xs mb-2">${deviceIcon} ${u.device || '?'}</div>
                            <button onclick="nudgeUser('${u.email}', '${u.name}')" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg transform active:scale-95 transition">
                                <i class="fas fa-bell"></i> הקפץ עכשיו
                            </button>
                        </div>
                    </div>
                `;
            });
        });

        // פונקציית ההקפצה (שולחת ישר ל-Firebase)
        window.nudgeUser = async (email, name) => {
            const { value: text } = await Swal.fire({
                title: `להקפיץ את ${name}?`,
                input: 'text',
                inputPlaceholder: 'הודעה (למשל: תעלה מול יואב)',
                background: '#222', color: '#fff',
                confirmButtonColor: '#d33',
                confirmButtonText: 'שגר אזעקה 🚨'
            });

            if (text) {
                await addDoc(collection(db, "tasks"), {
                    title: "הודעת מנהל מתפרצת",
                    desc: text,
                    assignedTo: email, // זה המפתח! האימייל חייב להיות זהה
                    status: 'pending',
                    mustConfirm: true,
                    createdAt: serverTimestamp()
                });
                const Toast = Swal.mixin({toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true});
                Toast.fire({ icon: 'success', title: 'נשלח בהצלחה' });
            }
        };
    </script>
</body>
</html>
