<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saban Dashboard</title>

    <script>
        if (window.top === window.self) {
            window.location.href = "index.html";
        }
    </script>
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        const isHealthy = await new Promise(r => { try { let q=indexedDB.open("t");q.onsuccess=()=>{q.result.close();r(true)};q.onerror=()=>r(false);}catch{r(false)}});
        if(isHealthy) await OneSignal.init({ appId: "07b81f2e-e812-424f-beca-36584b12ccf2" });
      });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { 
            background: #0f172a; 
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            padding: 20px; padding-bottom: 100px; min-height: 100vh;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        .glass-btn {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            padding: 20px; height: 120px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); position: relative; overflow: hidden;
        }
        .glass-btn:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.1); }

        .icon-glow {
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
        }
        
        .g-green { background: linear-gradient(135deg, #22c55e, #14532d); }
        .g-blue { background: linear-gradient(135deg, #3b82f6, #1e3a8a); }
        .g-purple { background: linear-gradient(135deg, #a855f7, #581c87); }
        .g-orange { background: linear-gradient(135deg, #f97316, #7c2d12); }
        .g-red { background: linear-gradient(135deg, #ef4444, #991b1b); }

        /* אנימציית פעימה לנקודה הירוקה */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .status-pulse { animation: pulse-green 2s infinite; }
    </style>
</head>
<body>

    <div class="glass-btn mb-6 !flex-row !justify-between !items-center !h-auto !p-5" style="background: linear-gradient(135deg, #1e293b, #0f172a);">
        <div class="flex items-center gap-4">
            <div class="relative">
                <img id="user-avatar" src="" class="w-14 h-14 rounded-2xl object-cover border-2 border-white/10 shadow-lg bg-slate-700">
                <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 border-2 border-[#0f172a] rounded-full status-pulse"></div>
            </div>
            
            <div>
                <div class="text-gray-400 text-[10px] font-bold uppercase tracking-wider mb-0.5" id="user-role">טוען...</div>
                <h1 class="text-xl font-black text-white leading-tight" id="user-name">...</h1>
                <div class="text-[10px] text-green-400 font-bold mt-1 flex items-center gap-1">
                    <i class="fas fa-wifi text-[8px]"></i> מחובר למערכת
                </div>
            </div>
        </div>
        
        <div class="text-right pl-2 border-r border-white/10 pr-4 mr-2">
            <div id="clock" class="text-2xl font-mono font-bold text-white opacity-90">00:00</div>
            <div id="date" class="text-[10px] text-gray-400 font-bold uppercase">...</div>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4" id="apps-grid">
        
        <div class="glass-btn" onclick="goTo('chat', 'מרכז תקשורת')">
            <div class="icon-glow g-green"><i class="fab fa-whatsapp"></i></div>
            <div class="text-center">
                <div class="font-bold text-sm">תקשורת</div>
                <div class="text-[10px] text-gray-400">צ'אט, קבוצות</div>
            </div>
        </div>

        <div class="glass-btn" onclick="goTo('drive', 'ארכיון מסמכים')">
            <div class="icon-glow g-blue"><i class="fas fa-folder-open"></i></div>
            <div class="text-center">
                <div class="font-bold text-sm">הארכיון</div>
                <div class="text-[10px] text-gray-400">מסמכים ותיוק</div>
            </div>
        </div>

        <div class="glass-btn" onclick="goTo('harel', 'משימות הראל')">
            <div class="icon-glow g-red"><i class="fas fa-tasks"></i></div>
            <div class="text-center">
                <div class="font-bold text-sm">משימות</div>
                <div class="text-[10px] text-gray-400">ניהול שוטף</div>
            </div>
        </div>

        <div class="glass-btn" onclick="goTo('calendar', 'יומן חכם')">
            <div class="icon-glow g-orange"><i class="fas fa-calendar-alt"></i></div>
            <div class="text-center">
                <div class="font-bold text-sm">יומן</div>
                <div class="text-[10px] text-gray-400">פגישות ולו"ז</div>
            </div>
        </div>

        </div>

    <div class="mt-6 flex justify-between px-4">
        <div class="text-center" onclick="goTo('team', 'צוותים')">
            <div class="text-2xl font-bold text-white"><i class="fas fa-users text-blue-400"></i></div>
            <div class="text-[10px] text-gray-500 uppercase font-bold">צוות</div>
        </div>
        <div class="text-center" onclick="goTo('truck', 'נהגים')">
            <div class="text-2xl font-bold text-white"><i class="fas fa-truck text-orange-400"></i></div>
            <div class="text-[10px] text-gray-500 uppercase font-bold">נהגים</div>
        </div>
        <div class="text-center">
            <div class="text-2xl font-bold text-green-400">100%</div>
            <div class="text-[10px] text-gray-500 uppercase font-bold">יעילות</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" }));

        // 1. זיהוי המשתמש והצגת פרטים
        const userEmail = localStorage.getItem('saban_user_email');
        
        if (userEmail) {
            getDoc(doc(db, "users", userEmail)).then(snap => {
                if (snap.exists()) {
                    const user = snap.data();
                    
                    // עדכון טקסטים
                    document.getElementById('user-name').innerText = user.name;
                    document.getElementById('user-role').innerText = user.jobTitle || user.role;
                    
                    // עדכון תמונה (אם אין, השתמש באווטאר גנרי חכם)
                    const avatarUrl = user.photoUrl || `https://ui-avatars.com/api/?name=${user.name}&background=${user.color || '64748b'}&color=fff`;
                    document.getElementById('user-avatar').src = avatarUrl;

                    // הוספת כפתור ניהול אם זה מנכ"ל
                    if (user.role === 'מנכ״ל') {
                        addAdminButton();
                    }
                } else {
                    // מקרה קצה: המשתמש נמחק מהדאטה בייס
                    window.location.href = 'login.html';
                }
            }).catch(err => console.error("Error loading user:", err));
        } else {
            // לא מחובר
            window.location.href = 'login.html';
        }

        function addAdminButton() {
            const grid = document.getElementById('apps-grid');
            const adminBtn = document.createElement('div');
            adminBtn.className = 'glass-btn';
            adminBtn.onclick = () => window.parent.location.href = 'admin-console.html';
            adminBtn.innerHTML = `
                <div class="icon-glow g-purple"><i class="fas fa-user-shield"></i></div>
                <div class="text-center">
                    <div class="font-bold text-sm">ניהול</div>
                    <div class="text-[10px] text-gray-400">כוח אדם</div>
                </div>
            `;
            grid.appendChild(adminBtn);
        }

        // ניווט דרך האבא
        window.goTo = (id, title) => {
            if (window.parent && window.parent.openApp) {
                window.parent.openApp(id, title);
            } else {
                window.location.href = "index.html";
            }
        };

        // שעון ותאריך
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
            
            const dateOptions = { weekday: 'short', day: 'numeric', month: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('he-IL', dateOptions);
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
