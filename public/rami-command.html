<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rami's Command Center</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background-color: #050505; color: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        
        /* Grid Layout for Desktop */
        .grid-layout { display: grid; grid-template-columns: 280px 1fr 350px; height: 100vh; gap: 1px; background: #262626; }
        
        /* Mobile Layout Adjustment */
        @media (max-width: 1024px) {
            .grid-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; height: 100vh; display: flex; flex-direction: column; }
            .desktop-only { display: none; }
            .mobile-tabs { display: flex; }
        }

        .panel { background: #0f0f0f; padding: 16px; overflow-y: auto; height: 100%; }
        .panel-header { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #525252; letter-spacing: 1px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #262626; padding-bottom: 8px; }

        /* The Melshinon Feed */
        .log-item { font-family: 'Courier New', monospace; font-size: 12px; padding: 8px; border-bottom: 1px solid #1f1f1f; display: flex; gap: 10px; align-items: flex-start; animation: fadeIn 0.3s; }
        .log-time { color: #525252; min-width: 50px; }
        .log-user { color: #3b82f6; font-weight: bold; }
        .log-action { color: #a3a3a3; }
        .log-urgent { background: rgba(220, 38, 38, 0.1); border-right: 3px solid #dc2626; }

        /* Sidur Cards */
        .task-card { background: #171717; border: 1px solid #262626; padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; position: relative; }
        .task-card:hover { border-color: #3b82f6; background: #1f1f1f; }
        .driver-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #262626; color: #a3a3a3; position: absolute; top: 10px; left: 10px; }
        
        /* Status Pulse */
        .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .driver-row { display: flex; align-items: center; justify-content: space-between; background: #171717; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .progress-bar { height: 4px; background: #262626; border-radius: 2px; overflow: hidden; flex: 1; margin: 0 10px; }
        .progress-fill { height: 100%; background: #3b82f6; }

        /* Mobile Bottom Nav */
        .mobile-nav { height: 60px; background: #0f0f0f; border-top: 1px solid #262626; display: none; justify-content: space-around; align-items: center; }
        @media (max-width: 1024px) { .mobile-nav { display: flex; } }
        .nav-btn { color: #525252; font-size: 20px; }
        .nav-btn.active { color: #3b82f6; }
    </style>
</head>
<body>

    <div class="grid-layout">
        
        <div class="panel border-l border-[#262626] hidden lg:block">
            <div class="panel-header">
                <span><i class="fas fa-server"></i> System Status</span>
                <div class="live-dot"></div>
            </div>
            
            <div class="mb-6">
                <div class="text-xs text-gray-500 mb-2 font-bold">נהגים פעילים</div>
                <div class="driver-row">
                    <div class="flex items-center gap-2">
                        <div class="w-6 h-6 rounded-full bg-green-900/50 text-green-500 flex items-center justify-center text-xs">ע</div>
                        <span class="text-sm">עלי</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width: 80%"></div></div>
                    <span class="text-xs text-gray-400">4/5</span>
                </div>
                <div class="driver-row">
                    <div class="flex items-center gap-2">
                        <div class="w-6 h-6 rounded-full bg-orange-900/50 text-orange-500 flex items-center justify-center text-xs">ח</div>
                        <span class="text-sm">חכמת</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width: 40%"></div></div>
                    <span class="text-xs text-gray-400">2/5</span>
                </div>
            </div>

            <div class="bg-[#171717] p-4 rounded-xl border border-[#262626]">
                <canvas id="ordersChart"></canvas>
            </div>
        </div>

        <div class="panel relative" id="main-panel">
            <div class="panel-header">
                <span><i class="fas fa-th-large"></i> סידור עבודה - ראמי מסארוה</span>
                <button onclick="newTask()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-xs font-bold">+ משימה</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <h3 class="text-xs font-bold text-gray-500 mb-3 bg-[#171717] p-2 rounded">📥 נכנס (יואב/איציק/נתנאל)</h3>
                    <div id="pending-tasks" class="space-y-2 min-h-[100px]">
                        </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-gray-500 mb-3 bg-[#171717] p-2 rounded">🚚 בביצוע (נהגים)</h3>
                    <div id="active-tasks" class="space-y-2 min-h-[100px]">
                        </div>
                </div>
            </div>
        </div>

        <div class="panel border-r border-[#262626]" id="logs-panel">
            <div class="panel-header">
                <span><i class="fas fa-eye"></i> המלשינון (Live Feed)</span>
                <button onclick="clearLogs()" class="text-[10px] text-gray-600 hover:text-white">נקה</button>
            </div>
            <div id="melshinon-feed" class="flex flex-col gap-0">
                <div class="text-center text-gray-600 py-10 text-xs">ממתין לפעילות ברשת...</div>
            </div>
        </div>

    </div>

    <div class="mobile-nav">
        <div class="nav-btn active" onclick="switchTab('sidur')"><i class="fas fa-tasks"></i></div>
        <div class="nav-btn" onclick="switchTab('logs')"><i class="fas fa-list-alt"></i></div>
        <div class="nav-btn" onclick="switchTab('stats')"><i class="fas fa-chart-pie"></i></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot, addDoc, serverTimestamp, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" });
        const db = getFirestore(app);

        // וידוא שרק ראמי נכנס
        const userEmail = localStorage.getItem('saban_user_email');
        if (userEmail !== 'ramims@saban94.co.il' && userEmail !== 'harel@saban.os') { // הוספתי את הראל כגיבוי
             // window.location.href = 'index.html'; // uncomment for production
        }

        // --- 1. המלשינון (The Log System) ---
        // מאזין לאוסף "logs" בדאטה בייס בזמן אמת
        const qLogs = query(collection(db, "logs"), orderBy("createdAt", "desc"), limit(50));
        
        onSnapshot(qLogs, (snapshot) => {
            const feed = document.getElementById('melshinon-feed');
            feed.innerHTML = '';
            
            snapshot.forEach(d => {
                const log = d.data();
                const time = log.createdAt ? new Date(log.createdAt.seconds * 1000).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'}) : '--:--';
                
                // עיצוב לפי סוג פעולה
                let icon = 'fa-info-circle';
                let color = 'text-gray-400';
                
                if (log.type === 'order') { icon = 'fa-shopping-cart'; color = 'text-green-500'; }
                if (log.type === 'error') { icon = 'fa-exclamation-triangle'; color = 'text-red-500'; }
                if (log.type === 'login') { icon = 'fa-sign-in-alt'; color = 'text-blue-500'; }

                const html = `
                    <div class="log-item ${log.urgent ? 'log-urgent' : ''}">
                        <div class="log-time font-mono">${time}</div>
                        <div class="flex-1">
                            <span class="log-user">${log.user}</span>
                            <span class="log-action ml-1 text-gray-400">${log.action}</span>
                        </div>
                        <i class="fas ${icon} ${color} text-[10px]"></i>
                    </div>
                `;
                feed.innerHTML += html;
            });
        });

        // --- 2. סידור עבודה (Tasks) ---
        const qTasks = query(collection(db, "tasks"), orderBy("createdAt", "desc"));
        
        onSnapshot(qTasks, (snapshot) => {
            const pending = document.getElementById('pending-tasks');
            const active = document.getElementById('active-tasks');
            pending.innerHTML = ''; active.innerHTML = '';

            snapshot.forEach(d => {
                const task = d.data();
                const el = document.createElement('div');
                el.className = 'task-card';
                el.onclick = () => openXRay(d.id, task); // לחיצה פותחת רנטגן
                
                let driverHtml = '';
                if(task.driver) driverHtml = `<div class="driver-badge border border-gray-700">${task.driver}</div>`;

                el.innerHTML = `
                    ${driverHtml}
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-bold text-sm text-white">${task.title}</span>
                        <span class="text-[10px] text-gray-500 bg-[#0f0f0f] px-1 rounded">${task.source || 'יואב'}</span>
                    </div>
                    <div class="text-xs text-gray-400 truncate">${task.desc || 'העברה בין סניפים...'}</div>
                    <div class="mt-2 flex justify-between items-center">
                        <span class="text-[10px] text-gray-600 font-mono">#${d.id.slice(0,4)}</span>
                        ${!task.driver ? `<button onclick="assignDriver(event, '${d.id}')" class="text-[10px] text-blue-400 border border-blue-900 px-2 py-0.5 rounded hover:bg-blue-900">שבץ נהג</button>` : ''}
                    </div>
                `;

                if (task.status === 'pending') pending.appendChild(el);
                else active.appendChild(el);
            });
        });

        // --- פונקציות ניהול ---
        window.assignDriver = async (e, id) => {
            e.stopPropagation();
            const { value: driver } = await Swal.fire({
                title: 'שיבוץ נהג',
                input: 'select',
                inputOptions: { 'ali': 'עלי', 'hikmat': 'חכמת', 'yossi': 'יוסי' },
                background: '#171717', color: '#fff'
            });

            if (driver) {
                await updateDoc(doc(db, "tasks", id), { 
                    driver: driver, 
                    status: 'active',
                    driverAssignedAt: serverTimestamp() 
                });
                
                // רישום בלוג (המלשינון)
                addDoc(collection(db, "logs"), {
                    user: 'ראמי',
                    action: `שיבץ את ${driver} למשימה ${id.slice(0,4)}`,
                    type: 'admin',
                    createdAt: serverTimestamp()
                });
            }
        };

        window.newTask = async () => {
            // טופס מהיר ליצירת משימה
            const { value: formValues } = await Swal.fire({
                title: 'משימה חדשה',
                html: `
                    <select id="swal-source" class="w-full mb-2 bg-gray-800 text-white p-2 rounded"><option>יואב (הזמנות)</option><option>איציק</option><option>נתנאל</option></select>
                    <input id="swal-title" class="w-full mb-2 bg-gray-800 text-white p-2 rounded" placeholder="מה להעביר?">
                    <input id="swal-desc" class="w-full bg-gray-800 text-white p-2 rounded" placeholder="פרטים נוספים">
                `,
                background: '#171717', color: '#fff',
                preConfirm: () => {
                    return [
                        document.getElementById('swal-source').value,
                        document.getElementById('swal-title').value,
                        document.getElementById('swal-desc').value
                    ]
                }
            });

            if (formValues) {
                await addDoc(collection(db, "tasks"), {
                    source: formValues[0],
                    title: formValues[1],
                    desc: formValues[2],
                    status: 'pending',
                    createdAt: serverTimestamp(),
                    createdBy: 'ראמי'
                });
            }
        };

        // רנטגן (X-Ray)
        window.openXRay = (id, task) => {
            Swal.fire({
                title: `רנטגן משימה: ${task.title}`,
                html: `
                    <div class="text-right text-sm text-gray-300">
                        <p><b>מקור:</b> ${task.source}</p>
                        <p><b>סטטוס:</b> ${task.status}</p>
                        <p><b>נוצר:</b> ${new Date(task.createdAt.seconds*1000).toLocaleString()}</p>
                        <hr class="border-gray-700 my-2">
                        <p class="text-xs font-mono text-gray-500">Log ID: ${id}</p>
                    </div>
                `,
                background: '#0f0f0f', color: '#fff',
                showCancelButton: true,
                cancelButtonText: 'סגור',
                confirmButtonText: '🗑️ מחק משימה',
                confirmButtonColor: '#dc2626'
            }).then((res) => {
                if(res.isConfirmed) { /* logic to delete */ }
            });
        };

        // מובייל טאבים
        window.switchTab = (tab) => {
            const main = document.getElementById('main-panel');
            const logs = document.getElementById('logs-panel');
            
            if (tab === 'sidur') {
                main.style.display = 'block';
                logs.style.display = 'none';
            } else if (tab === 'logs') {
                main.style.display = 'none';
                logs.style.display = 'block';
            }
        };

        // אתחול גרף
        const ctx = document.getElementById('ordersChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['הסתיים', 'בביצוע', 'ממתין'],
                datasets: [{
                    data: [12, 5, 3],
                    backgroundColor: ['#22c55e', '#3b82f6', '#64748b'],
                    borderWidth: 0
                }]
            },
            options: { plugins: { legend: { display: false } }, cutout: '70%' }
        });
    </script>
</body>
</html>
