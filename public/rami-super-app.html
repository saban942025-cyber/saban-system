<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rami Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>body{background:#f3f4f6;}</style>
</head>
<body>

    <div class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-20">
        <div>
            <div class="text-xs text-slate-400 font-bold tracking-widest uppercase">חדר בקרה</div>
            <h1 class="text-xl font-black text-slate-800">Saban<span class="text-blue-600">OS</span></h1>
        </div>
        <img src="https://ui-avatars.com/api/?name=Rami&background=000&color=fff" class="w-10 h-10 rounded-full">
    </div>

    <div class="max-w-5xl mx-auto p-4 space-y-6">
        
        <div class="grid grid-cols-2 gap-3">
            <div onclick="location.href='admin-console.html'" class="bg-white p-4 rounded-2xl shadow-sm text-center border border-slate-100 active:scale-95 transition">
                <i class="fas fa-users text-2xl text-purple-500 mb-2"></i>
                <div class="font-bold text-sm">צוות</div>
            </div>
            <div onclick="location.href='documents-drive.html'" class="bg-white p-4 rounded-2xl shadow-sm text-center border border-slate-100 active:scale-95 transition">
                <i class="fas fa-folder-open text-2xl text-yellow-500 mb-2"></i>
                <div class="font-bold text-sm">מסמכים</div>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h2 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span> מעקב זמן אמת
            </h2>
            
            <div id="users-grid" class="space-y-3">
                <div class="text-center text-slate-400 text-sm">מפעיל רדאר...</div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" });
        const db = getFirestore(app);

        // האזנה חיה
        onSnapshot(collection(db, "users"), (snapshot) => {
            const grid = document.getElementById('users-grid');
            grid.innerHTML = '';
            const now = new Date();

            snapshot.forEach(doc => {
                const u = doc.data();
                
                // חישוב זמן
                let isOnline = false;
                let lastSeenStr = 'מנותק';
                
                if (u.lastSeen) {
                    const lastDate = u.lastSeen.toDate();
                    const diffSec = (now - lastDate) / 1000;
                    lastSeenStr = lastDate.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
                    if (diffSec < 70) isOnline = true; // אם שידר ב-70 שניות אחרונות
                }

                const statusColor = isOnline ? 'bg-green-500' : 'bg-gray-300';
                const statusBorder = isOnline ? 'border-green-500' : 'border-transparent';
                const opacity = isOnline ? 'opacity-100' : 'opacity-60';

                grid.innerHTML += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border ${statusBorder} transition-all duration-300 ${opacity}">
                        <div class="flex items-center gap-3">
                            <div class="relative">
                                <img src="${u.photoUrl || 'https://ui-avatars.com/api/?name='+u.name}" class="w-10 h-10 rounded-full">
                                <div class="absolute bottom-0 right-0 w-3 h-3 ${statusColor} border-2 border-white rounded-full"></div>
                            </div>
                            <div>
                                <div class="font-bold text-sm text-slate-800">${u.name}</div>
                                <div class="text-[10px] text-slate-500">${isOnline ? 'מחובר עכשיו' : 'נראה: ' + lastSeenStr}</div>
                            </div>
                        </div>
                        <button onclick="pingUser('${u.email}', '${u.name}')" class="bg-white border border-slate-200 text-slate-600 w-8 h-8 rounded-full shadow-sm hover:text-blue-600 active:scale-90 transition">
                            <i class="fas fa-bell"></i>
                        </button>
                    </div>
                `;
            });
        });

        window.pingUser = async (email, name) => {
            const { value: msg } = await Swal.fire({
                title: `שליחה ל-${name}`,
                input: 'text',
                inputPlaceholder: 'הודעה מתפרצת...',
                showCancelButton: true,
                confirmButtonText: 'שגר 🚀'
            });

            if (msg) {
                await addDoc(collection(db, "tasks"), {
                    title: "הודעה מראמי",
                    desc: msg,
                    assignedTo: email,
                    status: 'pending',
                    mustConfirm: true,
                    createdAt: serverTimestamp()
                });
                Swal.fire({icon: 'success', title: 'נשלח', timer: 1500, showConfirmButton: false});
            }
        };
    </script>
</body>
</html>
