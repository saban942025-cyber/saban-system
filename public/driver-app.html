<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saban Driver</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

    <style>
        body { background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 80px; user-select: none; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; text-align: center; transition: 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: #f97316; color: white; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-waze { background: #33ccff; color: white; }
        
        canvas { border: 2px dashed #cbd5e1; border-radius: 12px; background: #f8fafc; width: 100%; height: 200px; touch-action: none; }
    </style>
</head>
<body>

    <div class="bg-slate-900 text-white p-5 pb-8 rounded-b-3xl shadow-lg mb-[-20px] relative z-0">
        <div class="flex justify-between items-center">
            <div>
                <div class="text-xs text-orange-400 font-bold uppercase">נהג פעיל</div>
                <div class="text-2xl font-black">משאית 404</div>
            </div>
            <div class="bg-white/10 p-2 rounded-lg"><i class="fas fa-truck text-2xl"></i></div>
        </div>
    </div>

    <div class="px-4 relative z-10">
        
        <div class="card">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <div class="text-xs text-gray-400 font-bold">יעד המשלוח</div>
                    <div class="text-xl font-bold text-slate-800">פרויקט "מגדלי הים"</div>
                    <div class="text-sm text-gray-500">רחוב העצמאות 55, נתניה</div>
                </div>
                <a href="https://waze.com/ul?q=נתניה" target="_blank" class="bg-blue-100 text-blue-600 p-3 rounded-full shadow-sm">
                    <i class="fab fa-waze text-2xl"></i>
                </a>
            </div>
            
            <div class="flex gap-2 mb-4">
                <div class="bg-orange-50 text-orange-700 px-3 py-1 rounded-lg text-xs font-bold border border-orange-100">📦 משטחים: 3</div>
                <div class="bg-blue-50 text-blue-700 px-3 py-1 rounded-lg text-xs font-bold border border-blue-100">🏗️ מנוף נדרש</div>
            </div>

            <div class="border-t pt-4">
                <div class="text-xs font-bold text-gray-400 mb-2">פעולות נהג</div>
                <label class="btn bg-white border border-slate-200 text-slate-600 mb-2">
                    <i class="fas fa-camera"></i> צלם הוכחת מסירה
                    <input type="file" accept="image/*" capture="environment" hidden onchange="handleImage(this)">
                </label>
                <div id="img-preview" class="hidden text-xs text-green-600 font-bold text-center mb-2">📸 תמונה נקלטה בהצלחה</div>
            </div>
        </div>

        <div class="card">
            <div class="flex justify-between items-center mb-2">
                <div class="text-sm font-bold text-slate-700">חתימת מקבל (על המסך)</div>
                <button onclick="clearPad()" class="text-xs text-red-500 font-bold">נקה</button>
            </div>
            <canvas id="signature-pad"></canvas>
            
            <input id="receiver-name" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl mt-3 text-sm" placeholder="שם המקבל">
            
            <button onclick="finishDelivery()" class="btn btn-primary mt-4">
                <i class="fas fa-check-circle"></i> אשר מסירה וסיים
            </button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" }));

        // אתחול משטח חתימה
        const canvas = document.getElementById('signature-pad');
        function resizeCanvas() {
            const ratio =  Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
        }
        window.onresize = resizeCanvas;
        resizeCanvas();

        const signaturePad = new SignaturePad(canvas, { backgroundColor: 'rgb(248, 250, 252)' });

        window.clearPad = () => signaturePad.clear();

        window.handleImage = (input) => {
            if(input.files.length > 0) {
                document.getElementById('img-preview').classList.remove('hidden');
            }
        };

        window.finishDelivery = async () => {
            const name = document.getElementById('receiver-name').value;
            
            if (signaturePad.isEmpty() || !name) {
                return Swal.fire('חסרים פרטים', 'יש למלא שם מקבל ולחתום', 'warning');
            }

            // סימולציית שמירה
            Swal.fire({
                title: 'שולח נתונים...',
                didOpen: () => Swal.showLoading()
            });

            try {
                // שמירת הלוג ב-Firebase כדי שהראל יראה
                await addDoc(collection(db, "task_logs"), {
                    taskId: 'delivery-123',
                    userId: 'driver-yossi',
                    userName: 'יוסי הנהג',
                    action: 'delivery_done',
                    details: `מסירה הושלמה ל-${name}`,
                    timestamp: serverTimestamp()
                });

                // שליחת התראה להראל (דרך גוגל סקריפט - וודא שעדכנת את ה-URL!)
                const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6tU2yOXn4BkP3xwlmgB8nKU-8u6BOSKXTXJjXsY9E86E_zYXpa9_aDxsPmd63X1Wd/exec"; 
                
                fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: 'no-cors',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        action: "send_push",
                        title: "משלוח הושלם! 🚚",
                        message: `יוסי מסר את הסחורה ל-${name} בנתניה`
                    })
                });

                Swal.fire('הצלחה!', 'תעודת משלוח דיגיטלית נשלחה.', 'success');
                signaturePad.clear();
                document.getElementById('receiver-name').value = '';
                document.getElementById('img-preview').classList.add('hidden');

            } catch (e) {
                console.error(e);
                Swal.fire('שגיאה', 'בדוק חיבור רשת', 'error');
            }
        };
    </script>
</body>
</html>
