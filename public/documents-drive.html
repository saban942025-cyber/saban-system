<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saban Drive Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { 
            background: #0f172a; 
            color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            padding: 20px; padding-bottom: 80px; min-height: 100vh;
        }
        
        .drive-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
            transition: 0.2s;
        }
        .drive-card:active { background: rgba(255,255,255,0.1); }

        .file-icon {
            width: 40px; height: 40px; border-radius: 8px;
            background: rgba(59, 130, 246, 0.2); color: #60a5fa;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .pdf-icon { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .sheet-icon { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .img-icon { background: rgba(168, 85, 247, 0.2); color: #c084fc; }

        /* כפתור העלאה צף */
        .fab-btn {
            position: fixed; bottom: 90px; left: 20px;
            width: 56px; height: 56px; border-radius: 50%;
            background: #2563eb; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5);
            transition: 0.2s; z-index: 50;
        }
        .fab-btn:active { transform: scale(0.9); }

        /* תגיות */
        .tag-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,0.1); margin-top: 4px; display: inline-block; }
    </style>
</head>
<body>

    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-black">המסמכים שלי</h1>
            <p class="text-xs text-slate-400">ארכיון מלא + העלאה</p>
        </div>
        <div class="bg-blue-600 w-10 h-10 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/30">
            <i class="fas fa-cloud"></i>
        </div>
    </div>

    <div class="relative mb-6">
        <input type="text" id="search-input" onkeyup="filterFiles()" placeholder="חיפוש לפי שם או תגית..." class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 px-4 pr-10 text-sm focus:outline-none focus:border-blue-500">
        <i class="fas fa-search absolute left-4 top-3.5 text-slate-500"></i>
    </div>

    <div id="file-list">
        <div class="text-center text-slate-500 mt-10">
            <i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i>
            <div>טוען מסמכים...</div>
        </div>
    </div>

    <button class="fab-btn" onclick="openUploadModal()">
        <i class="fas fa-plus"></i>
    </button>

    <script>
        // >>> שים כאן את הלינק המעודכן מגוגל <<<
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOe2eImk6TLNdwWbWHyurBYCA5X6lZ_TO85eBAaZcwMKOSpcy16MYhj86GFB3v1ly_/exec";

        let allFiles = [];

        async function loadFiles() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if (data.status === 'success') {
                    allFiles = data.files;
                    renderFiles(allFiles);
                }
            } catch (error) {
                console.error(error);
                document.getElementById('file-list').innerHTML = `<div class="text-center text-red-400">שגיאת טעינה. וודא שהסקריפט מעודכן.</div>`;
            }
        }

        function renderFiles(files) {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            
            if (files.length === 0) {
                list.innerHTML = '<div class="text-center text-slate-500">לא נמצאו קבצים</div>';
                return;
            }

            files.forEach(file => {
                let iconClass = 'file-icon';
                let icon = 'fa-file';
                
                if(file.type.includes('pdf')) { iconClass += ' pdf-icon'; icon = 'fa-file-pdf'; }
                else if(file.type.includes('spreadsheet') || file.type.includes('csv')) { iconClass += ' sheet-icon'; icon = 'fa-file-excel'; }
                else if(file.type.includes('image')) { iconClass += ' img-icon'; icon = 'fa-image'; }

                list.innerHTML += `
                <div class="drive-card" onclick="window.open('${file.url}', '_blank')">
                    <div class="flex items-center gap-3">
                        <div class="${iconClass}"><i class="fas ${icon}"></i></div>
                        <div>
                            <div class="font-bold text-sm truncate w-40">${file.name}</div>
                            <div class="flex gap-2 items-center">
                                <span class="tag-badge text-[10px]">${file.desc}</span>
                                <span class="text-[10px] text-slate-400">${file.date.split(',')[0]}</span>
                            </div>
                        </div>
                    </div>
                    <i class="fas fa-chevron-left text-slate-600 text-xs"></i>
                </div>`;
            });
        }

        function filterFiles() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = allFiles.filter(f => f.name.toLowerCase().includes(term) || f.desc.toLowerCase().includes(term));
            renderFiles(filtered);
        }

        async function openUploadModal() {
            const { value: formValues } = await Swal.fire({
                title: 'העלאת קובץ חדש',
                html: `
                    <input type="file" id="swal-input-file" class="swal2-input" style="border:none">
                    <select id="swal-input-tag" class="swal2-select w-full mt-2">
                        <option value="כללי">🏷️ תיוג: כללי</option>
                        <option value="חשבונית">💰 חשבונית</option>
                        <option value="חוזה">📜 חוזה</option>
                        <option value="תוכנית">🏗️ תוכנית עבודה</option>
                        <option value="תמונה">📷 תמונה מהשטח</option>
                    </select>
                `,
                focusConfirm: false,
                confirmButtonText: 'העלה לדרייב',
                showCancelButton: true,
                preConfirm: () => {
                    return [
                        document.getElementById('swal-input-file').files[0],
                        document.getElementById('swal-input-tag').value
                    ]
                }
            });

            if (formValues && formValues[0]) {
                uploadFile(formValues[0], formValues[1]);
            }
        }

        function uploadFile(file, tag) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function() {
                const base64Data = reader.result.split(',')[1]; // הסרת ה-header של ה-base64
                
                Swal.fire({ title: 'מעלה קובץ...', didOpen: () => Swal.showLoading() });

                try {
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        mode: 'no-cors',
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            action: "upload_file",
                            fileName: file.name,
                            mimeType: file.type,
                            fileData: base64Data,
                            tag: tag
                        })
                    });

                    Swal.fire('הצלחה', 'הקובץ עלה לדרייב!', 'success');
                    setTimeout(loadFiles, 2000); // רענון הרשימה

                } catch (e) {
                    Swal.fire('שגיאה', 'ההעלאה נכשלה', 'error');
                }
            };
        }

        // טעינה בהתחלה
        loadFiles();
    </script>
</body>
</html>
