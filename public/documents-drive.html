<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saban Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { 
            background: #0f172a; 
            color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            padding: 20px; padding-bottom: 80px; min-height: 100vh;
        }
        
        .drive-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
            transition: 0.2s;
        }
        .drive-card:active { background: rgba(255,255,255,0.1); }

        .file-icon {
            width: 40px; height: 40px; border-radius: 8px;
            background: rgba(59, 130, 246, 0.2); color: #60a5fa;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .pdf-icon { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .sheet-icon { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    </style>
</head>
<body>

    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-black">המסמכים שלי</h1>
            <p class="text-xs text-slate-400">מחובר ל-Google Drive</p>
        </div>
        <div class="bg-blue-600 w-10 h-10 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/30">
            <i class="fas fa-cloud"></i>
        </div>
    </div>

    <div class="relative mb-6">
        <input type="text" placeholder="חיפוש מסמך..." class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 px-4 pr-10 text-sm focus:outline-none focus:border-blue-500">
        <i class="fas fa-search absolute left-4 top-3.5 text-slate-500"></i>
    </div>

    <div id="file-list">
        <div class="text-center text-slate-500 mt-10">
            <i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i>
            <div>טוען מסמכים מהענן...</div>
        </div>
    </div>

    <script>
        // *** עדכן כאן את הלינק החדש מגוגל ***
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzOohS_LQnSvZWAh75Ils3DL4clp3AovbOqQYPhC1lceSTG9FWMRigexRFx1esNDR3b/exec";

        async function loadFiles() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                const list = document.getElementById('file-list');
                list.innerHTML = '';

                if (data.status === 'success' && data.files.length > 0) {
                    data.files.forEach(file => {
                        let iconClass = 'file-icon';
                        let icon = 'fa-file';
                        
                        if(file.type.includes('pdf')) { iconClass += ' pdf-icon'; icon = 'fa-file-pdf'; }
                        else if(file.type.includes('spreadsheet')) { iconClass += ' sheet-icon'; icon = 'fa-file-excel'; }

                        list.innerHTML += `
                        <div class="drive-card" onclick="window.open('${file.url}', '_blank')">
                            <div class="flex items-center gap-3">
                                <div class="${iconClass}"><i class="fas ${icon}"></i></div>
                                <div>
                                    <div class="font-bold text-sm truncate w-40">${file.name}</div>
                                    <div class="text-[10px] text-slate-400">${file.date.split(',')[0]}</div>
                                </div>
                            </div>
                            <i class="fas fa-chevron-left text-slate-600 text-xs"></i>
                        </div>`;
                    });
                } else {
                    list.innerHTML = '<div class="text-center text-slate-500">לא נמצאו קבצים בתיקייה</div>';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('file-list').innerHTML = `
                    <div class="text-center text-red-400 text-sm">
                        <i class="fas fa-exclamation-triangle mb-2 text-2xl"></i><br>
                        שגיאת CORS.<br>נא לבצע Deploy חדש בגוגל סקריפט.
                    </div>`;
            }
        }

        // טעינה ראשונית
        loadFiles();
    </script>
</body>
</html>
