<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saban Archive Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background: #f8fafc; color: #334155; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
        .header-sticky { background: rgba(255,255,255,0.95); backdrop-filter: blur(5px); padding: 16px 20px 10px 20px; position: sticky; top: 0; z-index: 40; border-bottom: 1px solid #e2e8f0; }
        .doc-card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); }
        .icon-box { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
        .ic-pdf { background: #fef2f2; color: #ef4444; } .ic-xls { background: #f0fdf4; color: #22c55e; } .ic-img { background: #faf5ff; color: #a855f7; } .ic-doc { background: #eff6ff; color: #3b82f6; } 
        .filter-chip { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; background: white; border: 1px solid #e2e8f0; color: #64748b; margin-left: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .filter-chip.active { background: #2563eb; color: white; border-color: #2563eb; }
        .fab-upload { position: fixed; bottom: 30px; left: 24px; width: 64px; height: 64px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); z-index: 50; }
        
        /* כפתור שיתוף בתוך הכרטיס */
        .share-btn { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #94a3b8; margin-right: 8px; border: 1px solid #e2e8f0; }
        .share-btn:active { background: #eff6ff; color: #2563eb; border-color: #2563eb; }
    </style>
</head>
<body>

    <div class="header-sticky">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">הארכיון</h1>
                <p class="text-xs text-slate-500 font-bold uppercase tracking-wider">ח.סבן תשתיות</p>
            </div>
            <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center border border-blue-100"><i class="fas fa-cloud-download-alt"></i></div>
        </div>
        <div class="relative mb-4">
            <input type="text" id="search" onkeyup="filterDocs()" placeholder="חיפוש קובץ..." class="w-full bg-slate-100 border-none rounded-2xl py-3.5 px-12 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            <i class="fas fa-search absolute right-4 top-3.5 text-slate-400"></i>
        </div>
        <div class="flex overflow-x-auto pb-2 no-scrollbar">
            <div class="filter-chip active" onclick="setFilter('all', this)">הכל</div>
            <div class="filter-chip" onclick="setFilter('חשבונית', this)">💰 חשבונית</div>
            <div class="filter-chip" onclick="setFilter('חוזה', this)">📜 חוזה</div>
            <div class="filter-chip" onclick="setFilter('תוכנית', this)">🏗️ תוכנית</div>
            <div class="filter-chip" onclick="setFilter('תמונה', this)">📷 תמונה</div>
        </div>
    </div>

    <div id="doc-list" class="p-4 space-y-3 min-h-[300px]">
        <div class="text-center pt-20 animate-pulse">
            <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full mx-auto mb-4 animate-spin"></div>
            <div class="text-slate-400 text-sm font-medium">מסנכרן...</div>
        </div>
    </div>

    <button class="fab-upload" onclick="openUpload()"><i class="fas fa-plus"></i></button>

    <script type="module">
        // Firebase Imports (חובה כדי לשלוח משימה)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" }));
        
        // Google Scripts (Docs & Alerts)
        const DOCS_API = "https://script.google.com/macros/s/AKfycbzu62mOPdMtttJVtVFncilG6rnxlfJ65ykMHNpGvkBzDoL3ECttcJ5uK2RAYIydveM9/exec";
        // הוסף כאן את ה-URL של סקריפט ההתראות שיצרת קודם (Saban Alerts)
        const ALERTS_API = "https://script.google.com/macros/s/AKfycbzu62mOPdMtttJVtVFncilG6rnxlfJ65ykMHNpGvkBzDoL3ECttcJ5uK2RAYIydveM9/exec"; // החלף ב-URL הנכון אם הוא שונה

        let dbFiles = [];
        let currentFilter = 'all';

        // הופך לפונקציה גלובלית כדי שה-HTML יכיר
        window.init = async () => { loadData(); };
        
        async function loadData() {
            try {
                const res = await fetch(DOCS_API + "?t=" + new Date().getTime());
                const data = await res.json();
                if (data.status === 'success') { dbFiles = data.files; renderList(); }
            } catch (e) { console.error(e); }
        }

        function renderList() {
            const container = document.getElementById('doc-list');
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = dbFiles.filter(f => {
                const matchText = f.name.toLowerCase().includes(term) || (f.desc && f.desc.toLowerCase().includes(term));
                const matchTag = currentFilter === 'all' || (f.desc && f.desc.includes(currentFilter));
                return matchText && matchTag;
            });

            if (filtered.length === 0) { container.innerHTML = '<div class="text-center text-slate-400 pt-10">ריק</div>'; return; }

            container.innerHTML = filtered.map(f => {
                let iconClass = 'ic-doc', icon = 'fa-file-alt';
                if (f.type.includes('pdf')) { iconClass = 'ic-pdf'; icon = 'fa-file-pdf'; }
                else if (f.type.includes('sheet') || f.type.includes('excel')) { iconClass = 'ic-xls'; icon = 'fa-file-excel'; }
                else if (f.type.includes('image')) { iconClass = 'ic-img'; icon = 'fa-image'; }

                return `
                <div class="doc-card">
                    <div class="flex items-center gap-4" onclick="window.open('${f.url}', '_blank')">
                        <div class="icon-box ${iconClass}"><i class="fas ${icon}"></i></div>
                        <div class="overflow-hidden">
                            <div class="font-bold text-slate-800 text-sm truncate w-32">${f.name}</div>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-2 py-0.5 rounded font-bold">${f.desc || 'כללי'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <button class="share-btn" onclick="shareFile('${f.url}', '${f.name}')">
                            <i class="fas fa-share-alt"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        window.shareFile = (url, name) => {
            Swal.fire({
                title: 'שתף מסמך',
                text: name,
                showCancelButton: true,
                cancelButtonText: 'ביטול',
                confirmButtonText: 'שלח בוואטסאפ 💚',
                confirmButtonColor: '#25D366',
                denyButtonText: 'הקפץ לצוות 🚨',
                showDenyButton: true,
                denyButtonColor: '#ef4444'
            }).then((result) => {
                if (result.isConfirmed) {
                    // WhatsApp
                    const text = `היי, מצורף מסמך לעיונך: ${name} \n${url}`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                } else if (result.isDenied) {
                    // Send to Team
                    selectUserAndSend(url, name);
                }
            });
        };

        async function selectUserAndSend(url, name) {
            // רשימת עובדים מדמה - אפשר לשלוף מ-Firebase אם רוצים
            const { value: userId } = await Swal.fire({
                title: 'בחר עובד להקפצה',
                input: 'select',
                inputOptions: {
                    'all': '📢 כולם (הודעה מתפרצת)',
                    'vered': 'ורד (מזכירות)',
                    'yossi': 'יוסי (נהג)',
                    'ahmed': 'אחמד (שטח)'
                },
                inputPlaceholder: 'בחר נמען...',
                showCancelButton: true,
                confirmButtonText: 'שגר התראה 🚀'
            });

            if (userId) {
                Swal.fire({ title: 'משגר...', didOpen: () => Swal.showLoading() });
                
                try {
                    // 1. יצירת משימה חוסמת ב-Firebase
                    await addDoc(collection(db, "tasks"), {
                        title: "מסמך לעיון דחוף: " + name,
                        desc: "נשלח מהארכיון. יש לאשר צפייה.",
                        docLink: url, // הלינק למסמך
                        assignedTo: userId,
                        mustConfirm: true, // מפעיל את המסך האדום
                        createdBy: 'הראל',
                        createdAt: serverTimestamp(),
                        status: 'pending',
                        readBy: []
                    });

                    // 2. שליחת Push דרך הגוגל סקריפט
                    fetch(ALERTS_API, {
                        method: "POST",
                        mode: 'no-cors',
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            action: "send_push",
                            title: "מסמך דחוף מהראל",
                            message: "לחץ לצפייה במסמך: " + name
                        })
                    });

                    Swal.fire('נשלח!', 'המסמך יקפוץ לעובד על המסך.', 'success');
                } catch (e) {
                    Swal.fire('שגיאה', 'לא ניתן לשלוח כרגע', 'error');
                }
            }
        }

        window.setFilter = (tag, btn) => { currentFilter = tag; document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active')); btn.classList.add('active'); renderList(); };
        window.filterDocs = () => renderList();
        
        // פונקציית העלאה (כמו קודם) - קוצרה לנוחות
        window.openUpload = async () => { /* ... אותו קוד העלאה מקודם ... */ 
             // (תעתיק לכאן את פונקציית openUpload המלאה מהקוד הקודם כדי לשמור על היכולת להעלות)
             const { value: formValues } = await Swal.fire({
                title: 'העלאה',
                html: '<input type="file" id="up-file" class="swal2-input"><select id="up-tag" class="swal2-input"><option value="כללי">כללי</option><option value="חשבונית">חשבונית</option></select>',
                preConfirm: () => [document.getElementById('up-file').files[0], document.getElementById('up-tag').value]
            });
            if(formValues && formValues[0]) {
                const reader = new FileReader();
                reader.readAsDataURL(formValues[0]);
                reader.onload = async () => {
                    const base64 = reader.result.split(',')[1];
                    Swal.showLoading();
                    await fetch(DOCS_API, { method: "POST", mode: 'no-cors', headers:{"Content-Type":"application/json"}, body: JSON.stringify({action:"upload_file", fileName:formValues[0].name, mimeType:formValues[0].type, fileData:base64, tag:formValues[1]})});
                    Swal.fire('הצלחה','','success'); setTimeout(loadData, 2000);
                }
            }
        };

        loadData();
    </script>
</body>
</html>
