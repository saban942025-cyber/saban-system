<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saban HR Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; }
        .user-row { transition: 0.2s; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .user-row:hover { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div class="max-w-4xl mx-auto">
        
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-black text-blue-500">ניהול צוות</h1>
                <p class="text-slate-400 text-sm">הקמה וניהול הרשאות משתמשים</p>
            </div>
            <button onclick="window.location.href='index.html'" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-bold">
                <i class="fas fa-arrow-right ml-2"></i> חזרה למערכת
            </button>
        </div>

        <div class="glass-card mb-8">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-user-plus text-green-400"></i> עובד חדש</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="new-name" placeholder="שם מלא" class="bg-slate-800 border border-slate-600 rounded-lg p-3 text-white focus:border-blue-500 outline-none">
                <input type="email" id="new-email" placeholder="אימייל להתחברות" class="bg-slate-800 border border-slate-600 rounded-lg p-3 text-white focus:border-blue-500 outline-none">
                <select id="new-role" class="bg-slate-800 border border-slate-600 rounded-lg p-3 text-white outline-none cursor-pointer">
                    <option value="נהג">🚛 נהג</option>
                    <option value="מזכירות">💼 מזכירות</option>
                    <option value="שטח">🏗️ מנהל עבודה</option>
                    <option value="מנכ״ל">👔 מנכ"ל (Admin)</option>
                </select>
                <button onclick="createUser()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition transform active:scale-95">
                    הוסף למערכת
                </button>
            </div>
            <div class="text-xs text-slate-500 mt-2">* סיסמה ראשונית לכולם: <b>SabanSaban</b> (יחויבו להחליף בכניסה)</div>
        </div>

        <div class="glass-card">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-users text-blue-400"></i> מצבת כוח אדם</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead>
                        <tr class="text-slate-400 border-b border-slate-600">
                            <th class="p-3">עובד</th>
                            <th class="p-3">תפקיד</th>
                            <th class="p-3">אימייל</th>
                            <th class="p-3">סטטוס סיסמה</th>
                            <th class="p-3 text-left">פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="users-list">
                        <tr><td colspan="5" class="text-center p-4">טוען נתונים...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        // הערה: יצירת משתמש Auth בצד לקוח מנתקת את המשתמש הנוכחי. 
        // בגרסת Production מלאה משתמשים ב-Cloud Functions. כאן נשתמש בפתרון "Setup" מהיר.
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" });
        const db = getFirestore(app);
        const auth = getAuth(app);

        // האזנה לרשימת המשתמשים בזמן אמת
        onSnapshot(collection(db, "users"), (snapshot) => {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            
            snapshot.forEach(d => {
                const user = d.data();
                const avatar = `https://ui-avatars.com/api/?name=${user.name}&background=${user.color || '64748b'}&color=fff`;
                
                const roleBadge = user.role === 'מנכ״ל' 
                    ? '<span class="bg-purple-900 text-purple-200 text-xs px-2 py-1 rounded border border-purple-700">מנהל מערכת</span>'
                    : `<span class="bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded">${user.role}</span>`;

                const passStatus = user.mustChangePassword 
                    ? '<span class="text-orange-400 text-xs"><i class="fas fa-clock"></i> טרם נכנס</span>'
                    : '<span class="text-green-400 text-xs"><i class="fas fa-check"></i> פעיל</span>';

                list.innerHTML += `
                    <tr class="user-row">
                        <td class="p-3 flex items-center gap-3">
                            <img src="${avatar}" class="w-8 h-8 rounded-lg">
                            <span class="font-bold">${user.name}</span>
                        </td>
                        <td class="p-3">${roleBadge}</td>
                        <td class="p-3 text-slate-400 font-mono text-xs">${user.email}</td>
                        <td class="p-3">${passStatus}</td>
                        <td class="p-3 text-left">
                            <button onclick="removeUser('${user.email}')" class="text-red-400 hover:text-red-300 bg-red-900/30 p-2 rounded hover:bg-red-900/50 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        });

        window.createUser = async () => {
            const name = document.getElementById('new-name').value;
            const email = document.getElementById('new-email').value;
            const role = document.getElementById('new-role').value;

            if(!name || !email) return Swal.fire('חסרים פרטים', '', 'warning');

            // צבע אקראי לאווטאר
            const color = Math.floor(Math.random()*16777215).toString(16);

            Swal.fire({ title: 'יוצר משתמש...', didOpen: () => Swal.showLoading() });

            try {
                // 1. שמירה בדאטה בייס (זה החלק הקריטי להרשאות)
                await setDoc(doc(db, "users", email), {
                    name, email, role, color,
                    mustChangePassword: true,
                    createdAt: new Date()
                });

                // 2. יצירת Auth (הערה: זה ינתק את המנהל הנוכחי כי זה צד-לקוח)
                // כדי למנוע ניתוק, בדרך כלל עושים את זה ב-Backend.
                // כאן נציג הודעה למנהל.
                try {
                   await createUserWithEmailAndPassword(auth, email, "SabanSaban");
                } catch(e) {
                   console.log("משתמש Auth אולי כבר קיים, ממשיך...");
                }

                Swal.fire({
                    title: 'העובד נוסף בהצלחה!',
                    text: 'שים לב: בגלל שיצרת משתמש חדש, המערכת תבקש ממך להתחבר מחדש.',
                    icon: 'success'
                }).then(() => {
                    // ניקוי שדות
                    document.getElementById('new-name').value = '';
                    document.getElementById('new-email').value = '';
                    // רענון כדי להתחבר מחדש למנהל
                    window.location.href = "login.html";
                });

            } catch (e) {
                Swal.fire('שגיאה', e.message, 'error');
            }
        };

        window.removeUser = async (email) => {
            const res = await Swal.fire({
                title: 'למחוק עובד?',
                text: 'הוא לא יוכל להתחבר יותר למערכת',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'כן, מחק'
            });

            if(res.isConfirmed) {
                await deleteDoc(doc(db, "users", email));
                Swal.fire('נמחק', 'המשתמש הוסר ממסד הנתונים', 'success');
            }
        };
    </script>
</body>
</html>
