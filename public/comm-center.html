<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saban Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #e5e7eb; display: flex; flex-direction: column; height: 100vh; font-family: -apple-system, sans-serif; }
        
        /* אזור ההודעות */
        #chat-feed { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        
        /* בועות הודעה */
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .msg-me { align-self: flex-end; background: #dcf8c6; border-radius: 16px 0 16px 16px; color: #111827; }
        .msg-other { align-self: flex-start; background: #ffffff; border-radius: 0 16px 16px 16px; color: #1f2937; }
        
        .msg-info { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 10px; color: #9ca3af; margin-top: 4px; }
        .msg-sender { font-size: 10px; font-weight: bold; color: #d97706; margin-bottom: 2px; }

        /* אזור כתיבה */
        .input-area { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #e5e7eb; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .msg-input { flex: 1; background: #f3f4f6; border: none; padding: 12px 16px; border-radius: 24px; outline: none; font-size: 15px; }
        .send-btn { width: 45px; height: 45px; background: #2563eb; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3); }
        .send-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="chat-feed">
        <div class="text-center text-gray-400 text-xs mt-4">טוען הודעות...</div>
    </div>

    <form class="input-area" onsubmit="sendMessage(event)">
        <input type="text" id="msg-text" class="msg-input" placeholder="כתוב הודעה..." autocomplete="off">
        <button type="submit" class="send-btn"><i class="fas fa-paper-plane"></i></button>
    </form>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot, addDoc, serverTimestamp, updateDoc, doc, getDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp({ apiKey: "AIzaSyA3qwgBX69Clu7pUdOnOEcfzUVyR7ADrNc", authDomain: "saban94-eb5f0.firebaseapp.com", projectId: "saban94-eb5f0" });
        const db = getFirestore(app);
        
        let currentUser = null;
        
        // טעינת משתמש מהלוקאל של האבא (המעטפת) או מהזיכרון
        const userEmail = localStorage.getItem('saban_user_email');
        if(!userEmail) window.location.href = 'login.html';

        // מנוע צליל "פופ" (ווצאף סטייל)
        const popSound = {
            ctx: new (window.AudioContext || window.webkitAudioContext)(),
            play: function() {
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
        };

        async function init() {
            // קבלת שם המשתמש
            const uDoc = await getDoc(doc(db, "users", userEmail));
            if(uDoc.exists()) currentUser = uDoc.data();

            // האזנה להודעות
            const q = query(collection(db, "chats"), orderBy("createdAt", "asc"), limit(100));
            
            onSnapshot(q, (snapshot) => {
                const feed = document.getElementById('chat-feed');
                
                // ניקוי ראשוני (רק בהתחלה)
                if(feed.innerText.includes('טוען')) feed.innerHTML = '';

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const msg = change.doc.data();
                        const isMe = msg.email === userEmail;
                        const id = change.doc.id;

                        // סימון כנקרא (אם זה לא אני ואני רואה את זה)
                        if (!isMe && (!msg.readBy || !msg.readBy.includes(userEmail))) {
                            updateDoc(doc(db, "chats", id), { readBy: arrayUnion(userEmail) });
                            popSound.play(); // צליל רק להודעות נכנסות
                        }

                        // בניית הבועה
                        const div = document.createElement('div');
                        div.className = `msg ${isMe ? 'msg-me' : 'msg-other'}`;
                        
                        const time = msg.createdAt ? new Date(msg.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...';
                        const check = (msg.readBy && msg.readBy.length > 1) ? '<i class="fas fa-check-double text-blue-500"></i>' : '<i class="fas fa-check"></i>';

                        div.innerHTML = `
                            ${!isMe ? `<div class="msg-sender">${msg.senderName}</div>` : ''}
                            <div>${msg.text}</div>
                            <div class="msg-info">
                                <span>${time}</span>
                                ${isMe ? check : ''}
                            </div>
                        `;
                        
                        feed.appendChild(div);
                        feed.scrollTop = feed.scrollHeight; // גלילה למטה
                    }
                });
            });
        }

        window.sendMessage = async (e) => {
            e.preventDefault();
            const input = document.getElementById('msg-text');
            const text = input.value.trim();
            if(!text || !currentUser) return;

            input.value = ''; // ניקוי מיד לחוויה מהירה

            await addDoc(collection(db, "chats"), {
                text: text,
                email: userEmail,
                senderName: currentUser.name,
                createdAt: serverTimestamp(),
                readBy: [userEmail]
            });
            
            // צליל שליחה קטן (יותר גבוה)
            // (אופציונלי - כרגע נשאיר שקט בשליחה כמו ווצאף)
        };

        init();
    </script>
</body>
</html>
